<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BioDataTools - A suite of free online bioinformatics tools with no installation required, offering nucleic acid sequence processing, statistical analysis, plotting and visualization, and other bioinformatics utilities.">
    <meta property="og:title" content="BioDataTools - Bioinformatics Web Tools">
    <meta property="og:description" content="A suite of free online bioinformatics tools with no installation required, offering nucleic acid sequence processing, statistical analysis, plotting and visualization, and other bioinformatics utilities.">
    <meta property="og:image" content="https://www.biodatatools.top/images/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://www.biodatatools.top/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BioDataTools">
    <meta name="twitter:card" content="summary_large_image">

    <title>BioDataTools</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button class="toggle-side-btn" id="toggleSideBtn">⇆</button>

    <header>
        <div class="header-wrap">
            <div class="header-left">
                <img src="images/logo.png" alt="BioDataTools Logo" class="header-logo">
                <div class="site-title">
                    <h1>BioDataTools</h1>
                    <div class="author">Author: Di Shang Fei Zhu (Hao Xue)</div>
                </div>
            </div>
            <div class="header-right">
                <a href="https://space.bilibili.com/33053326" target="_blank" class="bilibili-link">Bilibili Channel</a>
                <a href="https://github.com/shueho/BioDataTools" target="_blank" class="github-link">GitHub</a>
                <button id="langSwitchBtn" class="lang-switch-btn">中文</button>
            </div>
        </div>
    </header>

    <nav class="side-nav" id="sideNav">
        <h4>Navigation</h4>
        <ul id="navList"></ul>
    </nav>

    <div class="main">
        <div class="intro">
            <h2>Bioinformatics Tools Suite</h2>
            <p>BioDataTools is a suite of free online bioinformatics tools with no installation required.</p>
        </div>

        <div class="search-bar">
            <input type="text" id="toolSearchInput" placeholder="🔍 Search by tool name or description, e.g., protein...">
        </div>

        <div id="toolList"></div>
    </div>

    <div id="common-footer"></div>

    <script src="COMMON/footer-en.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>

    <script>
        const toggleSideBtn = document.getElementById('toggleSideBtn');
        const sideNav = document.querySelector('.side-nav');
        const mainWrap = document.querySelector('.main');

        toggleSideBtn.addEventListener('click', function() {
            sideNav.classList.toggle('hidden');
            mainWrap.classList.toggle('full-width');
            this.textContent = '⇆';
        });
    </script>
</body>
</html>
