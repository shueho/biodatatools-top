<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分组统计碱基/氨基酸使用情况 - BioDataTools</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../COMMON/global.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>分组统计碱基/氨基酸使用情况</h2>
            <p>导入FASTA序列并设置分组后按分组统计碱基或氨基酸的频数或频率。</p>
        </div>

        <div class="step-card">
            <div class="step-title">第一步：导入FASTA序列</div>
            <div class="radio-box">
                <label><input type="radio" name="inputMode" value="file" checked onchange="switchInputMode()">上传文件</label>
                <label><input type="radio" name="inputMode" value="text" onchange="switchInputMode()">粘贴文本</label>
            </div>
            <div class="file-input">
                <input type="file" id="fastaFile" accept=".fasta,.fa,.fna,.ffn,.faa,.frn,.txt,.fas">
            </div>
            <div class="text-input">
                <textarea id="fastaText" placeholder="粘贴标准FASTA格式内容" disabled></textarea>
            </div>
            <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px;">
                <button class="btn" id="loadBtn">导入序列</button>
                <button class="btn" id="exampleBtn">加载示例</button>
            </div>
            <div id="msgTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第二步：设置分组</div>
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:6px;">
                <span><strong>序列名 → 分组名映射表</strong> <span class="tip-text" style="display:inline; margin-left:10px;" id="seqCount">0条</span></span>
                <span style="font-size:0.85rem; color:#888;">（可复制到Excel修改第二列后粘贴回来，点击"应用分组"生效）</span>
            </div>
            <textarea id="groupTableText" placeholder="导入序列后，此处显示两列（序列名\t分组名），默认分组名为序列名本身。"></textarea>

            <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px;">
                <button class="btn" id="copyTableBtn">复制表格</button>
                <button class="btn" id="applyGroupBtn" disabled>应用分组</button>
                <button class="btn" id="resetBtn">清空所有</button>
            </div>
            <div id="applyTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：统计参数与结果</div>
            <div class="filter-box" style="margin-bottom:12px;">
                <label>统计模式：
                    <select id="statMode">
                        <option value="base">碱基模式</option>
                        <option value="amino">氨基酸模式</option>
                    </select>
                </label>
                <label id="seqTypeLabel">序列类型：
                    <select id="seqType">
                        <option value="DNA">DNA</option>
                        <option value="RNA">RNA</option>
                    </select>
                </label>
                <label>输出格式：
                    <select id="outputFormat">
                        <option value="count">频数</option>
                        <option value="freq">频率(%)</option>
                    </select>
                </label>
                <button class="btn" id="runStatBtn" disabled>执行统计</button>
            </div>

            <div id="resultArea" style="display:none;">
                <div class="result-toolbar">
                    <button class="btn" id="copyResultBtn" disabled>复制结果</button>
                    <button class="btn" id="exportResultBtn" disabled>导出表格</button>
                    <span id="toolbarTip" class="tip-text" style="margin:0;"></span>
                </div>
                <div class="table-container" id="resultTableWrap">
                    <table id="resultTable">
                        <thead id="resultHead"></thead>
                        <tbody id="resultBody"></tbody>
                    </table>
                </div>
                <div style="margin-top:6px; font-size:0.85rem; color:#6c757d;">
                    <span id="rowCount"></span>
                </div>
            </div>
            <div id="emptyResult" class="empty-tip">请完成分组后点击"执行统计"查看结果。</div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script>
        window.headerConfig = {};
    </script>
    <script src="../COMMON/utils.js"></script>
    <script src="../COMMON/header.js"></script>
    <script src="../COMMON/footer.js"></script>

    <script>
        (function() {
            'use strict';

            const fastaFile = document.getElementById('fastaFile');
            const fastaText = document.getElementById('fastaText');
            const loadBtn = document.getElementById('loadBtn');
            const exampleBtn = document.getElementById('exampleBtn');
            const msgTip = document.getElementById('msgTip');

            const groupTableText = document.getElementById('groupTableText');
            const copyTableBtn = document.getElementById('copyTableBtn');
            const applyGroupBtn = document.getElementById('applyGroupBtn');
            const resetBtn = document.getElementById('resetBtn');
            const applyTip = document.getElementById('applyTip');
            const seqCount = document.getElementById('seqCount');

            const statMode = document.getElementById('statMode');
            const seqType = document.getElementById('seqType');
            const seqTypeLabel = document.getElementById('seqTypeLabel');
            const outputFormat = document.getElementById('outputFormat');
            const runStatBtn = document.getElementById('runStatBtn');

            const resultArea = document.getElementById('resultArea');
            const emptyResult = document.getElementById('emptyResult');
            const resultHead = document.getElementById('resultHead');
            const resultBody = document.getElementById('resultBody');
            const rowCount = document.getElementById('rowCount');
            const copyResultBtn = document.getElementById('copyResultBtn');
            const exportResultBtn = document.getElementById('exportResultBtn');
            const toolbarTip = document.getElementById('toolbarTip');

            let sequences = [];          
            let groupMapping = {};       
            let statResult = [];         
            let resultCsvContent = '';

            function showMsg(el, msg, type) {
                const prefix = type === 'success' ? '✅ ' : (type === 'error' ? '❌ ' : '');
                el.innerHTML = `<span class="${type}">${prefix}${msg}</span>`;
                if (el === msgTip || el === applyTip || el === toolbarTip) {
                    setTimeout(() => { if (el.innerHTML === `<span class="${type}">${prefix}${msg}</span>`) el.innerHTML = ''; }, 5000);
                }
            }

            function toast(msg) {
                if (window.showToast) window.showToast(msg);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
            }

            function parseFasta(text) {
                const lines = text.split(/\r?\n/);
                const seqs = [];
                let name = '', seq = '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    if (trimmed.startsWith('>')) {
                        if (name && seq) seqs.push({ name, seq });
                        name = trimmed.slice(1).trim(); 
                        seq = '';
                    } else {
                        seq += trimmed;
                    }
                }
                if (name && seq) seqs.push({ name, seq });
                return seqs;
            }

            function loadSequences(text) {
                try {
                    const parsed = parseFasta(text);
                    if (parsed.length === 0) {
                        showMsg(msgTip, '未解析到有效序列（请检查FASTA格式）', 'error');
                        return false;
                    }
                    sequences = parsed.map(s => ({
                        name: s.name,
                        seq: s.seq,
                        group: s.name   
                    }));
                    updateGroupTable();
                    applyGroupBtn.disabled = false;
                    runStatBtn.disabled = false;
                    seqCount.textContent = sequences.length + '条';
                    resultArea.style.display = 'none';
                    emptyResult.style.display = 'block';
                    copyResultBtn.disabled = true;
                    exportResultBtn.disabled = true;
                    showMsg(msgTip, '成功加载 ' + sequences.length + ' 条序列', 'success');
                    toast('加载 ' + sequences.length + ' 条序列');
                    return true;
                } catch (e) {
                    showMsg(msgTip, '解析失败：' + e.message, 'error');
                    return false;
                }
            }

            function updateGroupTable() {
                const lines = sequences.map(s => s.name + '\t' + s.group);
                groupTableText.value = lines.join('\n');
                groupMapping = {};
                sequences.forEach(s => { groupMapping[s.name] = s.group; });
            }

            function applyGroup() {
                const text = groupTableText.value.trim();
                if (!text) {
                    showMsg(applyTip, '分组表为空，请先导入序列', 'error');
                    return;
                }
                const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                const newMap = {};
                let ok = true;
                for (const line of lines) {
                    const parts = line.split(/\t/);
                    if (parts.length < 2) {
                        showMsg(applyTip, '某行格式错误，请确保每行包含"序列名\t分组名"', 'error');
                        ok = false;
                        break;
                    }
                    const name = parts[0].trim();
                    const group = parts.slice(1).join('\t').trim(); 
                    if (!name) {
                        showMsg(applyTip, '序列名不能为空', 'error');
                        ok = false;
                        break;
                    }
                    newMap[name] = group || '未分组';
                }
                if (!ok) return;

                const seqNames = sequences.map(s => s.name);
                const missing = seqNames.filter(n => !(n in newMap));
                if (missing.length > 0) {
                    showMsg(applyTip, '以下序列未在表中找到：' + missing.join(', '), 'error');
                    return;
                }
                sequences.forEach(s => { s.group = newMap[s.name] || '未分组'; });
                groupMapping = newMap;
                updateGroupTable();
                showMsg(applyTip, '分组已更新', 'success');
                toast('分组已应用');
                resultArea.style.display = 'none';
                emptyResult.style.display = 'block';
                copyResultBtn.disabled = true;
                exportResultBtn.disabled = true;
            }

            function getBaseSet(type) {
                if (type === 'DNA') return ['A', 'T', 'G', 'C'];
                else return ['A', 'U', 'G', 'C'];
            }

            function getAminoSet() {
                return ['A','R','N','D','C','Q','E','G','H','I','L','K','M','F','P','S','T','W','Y','V'];
            }

            function runStatistics() {
                if (sequences.length === 0) {
                    showMsg(toolbarTip, '请先导入序列', 'error');
                    return;
                }
                const mode = statMode.value;
                const type = seqType.value;
                const format = outputFormat.value; // 'count' or 'freq'

                const groups = {};
                let allMerged = '';
                sequences.forEach(s => {
                    if (!groups[s.group]) groups[s.group] = [];
                    groups[s.group].push(s.seq);
                    allMerged += s.seq;
                });

                let headers = ['分组'];
                let resultRows = [];
                let charSet = [];

                if (mode === 'base') {
                    charSet = getBaseSet(type);
                } else {
                    charSet = getAminoSet();
                }

                const suffix = format === 'count' ? '' : '(%)';
                headers = headers.concat(charSet.map(c => c + suffix));
                headers.push('总长度');

                let totalLenAll = allMerged.length;
                const totalCounts = {};
                charSet.forEach(c => totalCounts[c] = 0);
                for (const ch of allMerged) {
                    const upper = ch.toUpperCase();
                    if (totalCounts.hasOwnProperty(upper)) totalCounts[upper]++;
                }

                for (const [group, seqs] of Object.entries(groups)) {
                    const merged = seqs.join('');
                    const totalLen = merged.length;
                    const counts = {};
                    charSet.forEach(c => counts[c] = 0);
                    for (const ch of merged) {
                        const upper = ch.toUpperCase();
                        if (counts.hasOwnProperty(upper)) counts[upper]++;
                    }
                    const row = [group];
                    if (format === 'count') {
                        charSet.forEach(c => row.push(counts[c] || 0));
                    } else {
                        charSet.forEach(c => {
                            const pct = totalLen > 0 ? ((counts[c] || 0) / totalLen * 100) : 0;
                            row.push(pct.toFixed(2));
                        });
                    }
                    row.push(totalLen);
                    resultRows.push(row);
                }

                const totalRow = ['汇总'];
                if (format === 'count') {
                    charSet.forEach(c => totalRow.push(totalCounts[c] || 0));
                } else {
                    charSet.forEach(c => {
                        const pct = totalLenAll > 0 ? ((totalCounts[c] || 0) / totalLenAll * 100) : 0;
                        totalRow.push(pct.toFixed(2));
                    });
                }
                totalRow.push(totalLenAll);
                resultRows.push(totalRow);

                resultHead.innerHTML = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
                let tbody = '';
                for (const row of resultRows) {
                    tbody += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
                }
                resultBody.innerHTML = tbody;
                rowCount.textContent = '共 ' + (resultRows.length - 1) + ' 个分组 + 汇总';

                resultCsvContent = headers.join('\t') + '\n' + resultRows.map(row => row.join('\t')).join('\n');

                resultArea.style.display = 'block';
                emptyResult.style.display = 'none';
                copyResultBtn.disabled = false;
                exportResultBtn.disabled = false;
                showMsg(toolbarTip, '统计完成', 'success');
                toast('统计完成');
            }

            function copyResult() {
                if (!resultCsvContent) {
                    showMsg(toolbarTip, '无结果可复制', 'error');
                    return;
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(resultCsvContent).then(() => {
                        showMsg(toolbarTip, '已复制结果(TSV格式)', 'success');
                        toast('已复制');
                    }).catch(() => fallbackCopy(resultCsvContent));
                } else {
                    fallbackCopy(resultCsvContent);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showMsg(toolbarTip, '已复制结果(TSV格式)', 'success');
                    toast('已复制');
                } catch (e) {
                    showMsg(toolbarTip, '复制失败，请手动复制', 'error');
                }
                document.body.removeChild(ta);
            }

            function exportResult() {
                if (!resultCsvContent) {
                    showMsg(toolbarTip, '无结果可导出', 'error');
                    return;
                }
                const csvContent = resultCsvContent.split('\n').map(line => line.split('\t').join(',')).join('\n');
                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'group_stats.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMsg(toolbarTip, '已导出CSV', 'success');
                toast('已导出');
            }

            function resetAll(silent = false) {
                if (sequences.length > 0) {
                    sequences.forEach(s => { s.group = s.name; });
                    groupTableText.value = '';          
                    groupMapping = {};
                    sequences.forEach(s => { groupMapping[s.name] = s.group; });
                    applyGroupBtn.disabled = false;
                    runStatBtn.disabled = false;
                } else {
                    groupTableText.value = '';
                    applyGroupBtn.disabled = true;
                    runStatBtn.disabled = true;
                }
                seqCount.textContent = sequences.length + '条';
                resultArea.style.display = 'none';
                emptyResult.style.display = 'block';
                copyResultBtn.disabled = true;
                exportResultBtn.disabled = true;
                msgTip.innerHTML = '';
                applyTip.innerHTML = '';
                toolbarTip.innerHTML = '';
                if (!silent) toast('已清空分组');
            }

            window.switchInputMode = function() {
                const mode = document.querySelector('input[name="inputMode"]:checked').value;
                if (mode === 'file') {
                    fastaFile.disabled = false;
                    fastaText.disabled = true;
                    fastaText.value = '';
                } else {
                    fastaFile.disabled = true;
                    fastaFile.value = '';
                    fastaText.disabled = false;
                }
            };

            function copyTable() {
                const text = groupTableText.value;
                if (!text) {
                    showMsg(applyTip, '没有可复制的内容', 'error');
                    return;
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => {
                        showMsg(applyTip, '已复制映射表', 'success');
                        toast('已复制');
                    }).catch(() => fallbackCopy(text, applyTip));
                } else {
                    fallbackCopy(text, applyTip);
                }
            }

            function loadExample() {
                const example = `>seq1  sequence one
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG
>seq2  sequence two
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG
>seq3  sequence three
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG
>seq4  sequence four
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG`;
                const radio = document.querySelector('input[name="inputMode"][value="text"]');
                if (radio) radio.checked = true;
                switchInputMode();
                fastaText.value = example;
                loadSequences(example);
            }

            loadBtn.addEventListener('click', function() {
                const mode = document.querySelector('input[name="inputMode"]:checked').value;
                if (mode === 'file') {
                    const file = fastaFile.files[0];
                    if (!file) {
                        showMsg(msgTip, '请选择文件', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        fastaText.value = e.target.result;
                        loadSequences(e.target.result);
                    };
                    reader.readAsText(file);
                } else {
                    const text = fastaText.value.trim();
                    if (!text) {
                        showMsg(msgTip, '请粘贴FASTA内容', 'error');
                        return;
                    }
                    loadSequences(text);
                }
            });

            exampleBtn.addEventListener('click', loadExample);

            copyTableBtn.addEventListener('click', copyTable);
            applyGroupBtn.addEventListener('click', applyGroup);
            resetBtn.addEventListener('click', resetAll);

            runStatBtn.addEventListener('click', runStatistics);

            copyResultBtn.addEventListener('click', copyResult);
            exportResultBtn.addEventListener('click', exportResult);

            groupTableText.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    if (!applyGroupBtn.disabled) applyGroupBtn.click();
                }
            });

            statMode.addEventListener('change', function() {
                seqTypeLabel.style.display = (this.value === 'base') ? 'inline' : 'none';
            });
            seqTypeLabel.style.display = 'inline';

            resetAll(true);
            switchInputMode();
        })();
    </script>

</body>
</html>
