<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变异位点提取工具 - BioDataTools</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/global.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main" id="app">
        <div class="page-intro">
            <h2>变异位点提取工具</h2>
            <p>从已比对的FASTA序列中提取所有变异位点。</p>
        </div>

        <div class="step-card">
            <div class="step-title">第一步：导入FASTA序列</div>
            <div class="mode-tabs">
                <label><input type="radio" name="inputMode" value="file" checked onchange="switchInput()"> 上传FASTA文件</label>
                <label><input type="radio" name="inputMode" value="text" onchange="switchInput()"> 粘贴FASTA文本</label>
            </div>
            <div class="file-input">
                <input type="file" id="fastaFile" accept=".fasta,.fa,.fna,.txt" disabled>
            </div>
            <div class="text-input">
                <textarea id="fastaText" placeholder="粘贴标准FASTA格式内容（支持多条序列，需已比对，长度一致）" disabled></textarea>
            </div>
            <div class="info-box">
                <strong>说明：</strong> 所有序列必须已经比对，长度完全相同。
            </div>
            <div style="margin-top:12px; display:flex; gap:10px;">
                <button class="btn" id="loadBtn">导入序列</button>
                <button class="btn" id="exampleBtn">加载示例</button>
            </div>
            <div id="msgTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第二步：参数设置</div>
            <div class="filter-box" style="gap:20px; align-items:center; flex-wrap:wrap;">
                <label>
                    <input type="checkbox" id="removeGapSites"> 
                    删除包含gap的位点
                    <span style="font-weight:400; color:#888; font-size:0.85rem; margin-left:4px;">（勾选后，若某位点存在“-”则删除该位点，否则保留）</span>
                </label>
            </div>
            <div style="margin-top:12px;">
                <button class="btn" id="extractBtn" disabled>提取变异位点</button>
            </div>
            <div id="extractMsg" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：提取结果</div>
            <div class="result-toolbar">
                <button class="btn" id="copyResultBtn" disabled>复制FASTA</button>
                <button class="btn" id="downloadResultBtn" disabled>下载FASTA</button>
                <span id="resultMsg" class="tip-text" style="margin:0;"></span>
            </div>
            <div id="resultArea" style="display:none;">
                <div style="margin-bottom:6px; font-weight:500; color:#1f4068;">
                    FASTA结果预览（前1000字符）<span id="resultStats" style="font-weight:400; color:#6c757d; font-size:0.85rem;"></span>
                </div>
                <div class="result-item" style="max-height:400px; overflow-y:auto; white-space:pre-wrap; font-family:Consolas,monospace; font-size:13px;" id="resultBox"></div>
            </div>
            <div id="emptyResult" class="empty-tip">提取后，结果将显示在此处。</div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script>
        window.headerConfig = {
            //author: '作者：地上飞猪',
        };
    </script>
    <script src="../COMMON/utils.js"></script>
    <script src="../COMMON/header.js"></script>
    <script src="../COMMON/footer.js"></script>
<script src="../COMMON/donate-widget.js"></script> 


    <script>
        (function() {
            'use strict';

            const fastaFile = document.getElementById('fastaFile');
            const fastaText = document.getElementById('fastaText');
            const loadBtn = document.getElementById('loadBtn');
            const exampleBtn = document.getElementById('exampleBtn');
            const msgTip = document.getElementById('msgTip');

            const removeGapSites = document.getElementById('removeGapSites');
            const extractBtn = document.getElementById('extractBtn');
            const extractMsg = document.getElementById('extractMsg');

            const resultArea = document.getElementById('resultArea');
            const emptyResult = document.getElementById('emptyResult');
            const resultBox = document.getElementById('resultBox');
            const resultStats = document.getElementById('resultStats');
            const copyResultBtn = document.getElementById('copyResultBtn');
            const downloadResultBtn = document.getElementById('downloadResultBtn');
            const resultMsg = document.getElementById('resultMsg');

            let sequences = [];
            let currentResult = '';

            function showMsg(el, msg, type) {
                el.innerHTML = `<span class="${type}">${msg}</span>`;
                if ([msgTip, extractMsg, resultMsg].includes(el)) {
                    setTimeout(() => { if (el.innerHTML === `<span class="${type}">${msg}</span>`) el.innerHTML = ''; }, 5000);
                }
            }

            function toast(msg) {
                if (window.showToast) window.showToast(msg);
            }

            function parseFasta(text) {
                const lines = text.split(/\r?\n/);
                const seqs = [];
                let name = '', seq = '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    if (trimmed.startsWith('>')) {
                        if (name && seq) seqs.push({ id: name, seq: seq });
                        name = trimmed.slice(1).trim().split(/\s+/)[0] || 'Unnamed';
                        seq = '';
                    } else {
                        seq += trimmed;
                    }
                }
                if (name && seq) seqs.push({ id: name, seq: seq });
                return seqs;
            }

            function checkLengths(seqs) {
                if (seqs.length === 0) return true;
                const len = seqs[0].seq.length;
                for (let i = 1; i < seqs.length; i++) {
                    if (seqs[i].seq.length !== len) return false;
                }
                return true;
            }

            function extractVariants(seqs, removeGap) {
                if (seqs.length === 0) return null;
                const seqLen = seqs[0].seq.length;
                const variantPositions = [];

                for (let i = 0; i < seqLen; i++) {
                    const chars = seqs.map(s => s.seq[i]);
                    const unique = new Set(chars);
                    if (unique.size === 1) continue;
                    if (removeGap && chars.includes('-')) continue;
                    variantPositions.push(i);
                }

                if (variantPositions.length === 0) return null;

                const newSeqs = seqs.map(s => {
                    let newSeq = '';
                    for (const pos of variantPositions) {
                        newSeq += s.seq[pos];
                    }
                    return { id: s.id, seq: newSeq };
                });

                return newSeqs;
            }

            function loadData(text) {
                const parsed = parseFasta(text);
                if (parsed.length === 0) {
                    showMsg(msgTip, '未解析到有效FASTA序列', 'error');
                    return false;
                }
                if (!checkLengths(parsed)) {
                    showMsg(msgTip, '所有序列长度不一致，请确保已比对。', 'error');
                    return false;
                }
                sequences = parsed;
                showMsg(msgTip, `成功加载 ${sequences.length} 条序列，长度 ${sequences[0].seq.length} bp`, 'success');
                toast(`已加载 ${sequences.length} 条序列`);
                extractBtn.disabled = false;
                clearResults();
                return true;
            }

            function loadFromFile() {
                const file = fastaFile.files[0];
                if (!file) { showMsg(msgTip, '请选择文件', 'error'); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    fastaText.value = e.target.result;
                    loadData(e.target.result);
                };
                reader.readAsText(file);
            }

            function loadFromText() {
                const text = fastaText.value.trim();
                if (!text) { showMsg(msgTip, '请粘贴FASTA内容', 'error'); return; }
                loadData(text);
            }

            function loadExample() {
                const example = `>seq1
ATGC-AGCTAGCAAGCTAGCTAGATAGCTAGCTAGCTAGGTAGCTAGC-AGCTAGCTAG
>seq2
ATGC-AGCTAGCTAGCTAGCTAGCTAGCTA-CTAGCTGGGTAGCTAGC-AGCTAGCTAG
>seq3
ATGCTAGCTAGCCAGCTAGCTAGATAGCTA-CTAGCTAGATAGCTAGC-AGCTAGCTAG
>seq4
ATGCAAGCTAGCTAGCTAGCTAGATAGCTAGCTAGCTAGATAGCTAGCTAGCTAGCTAG`;
                const radio = document.querySelector('input[name="inputMode"][value="text"]');
                if (radio) radio.checked = true;
                switchInput();
                fastaText.value = example;
                loadData(example);
            }

            function doExtract() {
                if (sequences.length === 0) {
                    showMsg(extractMsg, '请先导入序列', 'error');
                    return;
                }
                const removeGap = removeGapSites.checked;
                const newSeqs = extractVariants(sequences, removeGap);
                if (!newSeqs) {
                    showMsg(extractMsg, '未检测到任何变异位点（所有位点均一致）。', 'warn');
                    return;
                }

                let fasta = '';
                for (const s of newSeqs) {
                    fasta += '>' + s.id + '\n' + s.seq + '\n';
                }
                currentResult = fasta;

                resultArea.style.display = 'block';
                emptyResult.style.display = 'none';
                const preview = fasta.length > 1000 ? fasta.slice(0, 1000) + '\n... (截断)' : fasta;
                resultBox.textContent = preview;
                resultStats.textContent = `（共 ${newSeqs.length} 条序列，变异位点数 ${newSeqs[0].seq.length}，原始长度 ${sequences[0].seq.length} bp）`;
                copyResultBtn.disabled = false;
                downloadResultBtn.disabled = false;
                showMsg(extractMsg, `提取完成，共保留 ${newSeqs[0].seq.length} 个变异位点`, 'success');
                toast('提取完成');
            }

            function copyResult() {
                if (!currentResult) {
                    showMsg(resultMsg, '无内容可复制', 'error');
                    return;
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(currentResult).then(() => {
                        showMsg(resultMsg, '已复制FASTA内容', 'success');
                        toast('已复制');
                    }).catch(() => fallbackCopy(currentResult));
                } else {
                    fallbackCopy(currentResult);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showMsg(resultMsg, '已复制FASTA内容', 'success');
                    toast('已复制');
                } catch (e) {
                    showMsg(resultMsg, '复制失败，请手动复制', 'error');
                }
                document.body.removeChild(ta);
            }

            function downloadResult() {
                if (!currentResult) {
                    showMsg(resultMsg, '无内容可下载', 'error');
                    return;
                }
                const blob = new Blob([currentResult], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'variant_sites.fasta';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMsg(resultMsg, '已下载 variant_sites.fasta', 'success');
                toast('已下载');
            }

            function clearResults() {
                resultArea.style.display = 'none';
                emptyResult.style.display = 'block';
                currentResult = '';
                copyResultBtn.disabled = true;
                downloadResultBtn.disabled = true;
                resultBox.textContent = '';
                resultStats.textContent = '';
                resultMsg.innerHTML = '';
            }

            window.switchInput = function() {
                const mode = document.querySelector('input[name="inputMode"]:checked').value;
                if (mode === 'file') {
                    fastaFile.disabled = false;
                    fastaText.disabled = true;
                    fastaText.value = '';
                } else {
                    fastaFile.disabled = true;
                    fastaFile.value = '';
                    fastaText.disabled = false;
                }
                sequences = [];
                extractBtn.disabled = true;
                clearResults();
                msgTip.innerHTML = '';
                extractMsg.innerHTML = '';
            };

            fastaFile.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    fastaText.value = ev.target.result;
                    loadData(ev.target.result);
                };
                reader.readAsText(file);
                this.value = '';
            });

            fastaText.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    loadFromText();
                }
            });

            loadBtn.addEventListener('click', function() {
                const mode = document.querySelector('input[name="inputMode"]:checked').value;
                if (mode === 'file') {
                    if (!fastaFile.files || fastaFile.files.length === 0) {
                        if (fastaText.value.trim()) loadFromText();
                        else showMsg(msgTip, '请选择文件或粘贴数据', 'error');
                    } else {
                        loadFromFile();
                    }
                } else {
                    loadFromText();
                }
            });

            exampleBtn.addEventListener('click', loadExample);
            extractBtn.addEventListener('click', doExtract);
            copyResultBtn.addEventListener('click', copyResult);
            downloadResultBtn.addEventListener('click', downloadResult);

            removeGapSites.addEventListener('change', function() {
                if (sequences.length > 0 && !extractBtn.disabled) doExtract();
            });

            switchInput();
            emptyResult.style.display = 'block';
            resultArea.style.display = 'none';
            extractBtn.disabled = true;
            copyResultBtn.disabled = true;
            downloadResultBtn.disabled = true;
        })();
    </script>
</body>
</html>
