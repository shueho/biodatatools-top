<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Venn Diagram - BioStatPlot</title>
<link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon"/>
<link rel="stylesheet" href="../COMMON/common.css">
<style>
#chartDiv{width:100%;min-height:440px;position:relative;cursor:grab;overflow:hidden;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
#chartDiv:active{cursor:grabbing}
#chartDiv svg{display:block;margin:0 auto;background:white;border-radius:12px;width:100%;height:100%}
.plot-sidebar{height:calc(100vh - 140px);overflow-y:auto}
.plot-sidebar .collapsible-body{padding:12px 16px}
.lang-switch-wrap{display:flex;justify-content:flex-end;margin-bottom:10px}
.plot-main{height:calc(100vh - 140px);overflow:hidden;display:flex;flex-direction:column}
#chartDiv{flex:1;min-height:0}
</style>
<script src="../COMMON/colors.js"></script>
<script src="../COMMON/lang.js"></script>
<script src="../COMMON/common.js"></script>
<script src="../COMMON/defaults.js"></script>
<script src="../COMMON/header.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="common-header"></div>
<script>window.headerConfig={author:"Author: Di Shang Fei Zhu (Hao Xue)"};</script>
<div id="app"><div class="plot-layout">
<div class="plot-sidebar" style="width:340px">
<div class="collapsible-panel" style="margin-bottom:0">
<div class="collapsible-header" style="cursor:default"><span>Venn Diagram Config</span></div>
<div class="collapsible-body">
<div class="lang-switch-wrap"><button id="langSwitchBtn" class="lang-switch-btn">中文</button></div>
<div class="param-group"><h4>Set Labels</h4>
<div class="param-row" v-for="(s,i) in sets" :key="i"><label>Set {{i+1}}</label><input type="text" v-model="sets[i].label" @change="onConfigChange"></div></div>
<div class="param-group"><h4>Set Items (comma-separated)</h4>
<div class="param-row" v-for="(s,i) in sets" :key="i"><label>{{s.label||'Set'+(i+1)}}:</label><input type="text" :value="s.items.join(',')" @change="updateItems(i,$event)" style="font-size:0.8rem"></div></div>
<div class="param-group"><h4>Options</h4>
<div class="param-row"><label>Show Title</label><select v-model="config.showTitle" @change="onConfigChange"><option :value="true">Yes</option><option :value="false">No</option></select></div>
<div class="param-row" v-if="config.showTitle"><label>Title</label><input type="text" v-model="config.title" @change="onConfigChange"></div></div>
<div class="param-group"><h4>Export</h4><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
<button class="btn btn-sm" @click="exportAsSVG">SVG</button><button class="btn btn-sm" @click="exportAsPNG">PNG</button><button class="btn btn-sm" @click="exportAsPDF">PDF</button></div>
<button class="btn btn-sm btn-outline" @click="resetAll">Reset</button></div>
</div></div></div>
<div class="plot-main">
<div style="background:#fff;border-radius:16px;padding:8px;flex:1;display:flex;flex-direction:column;min-height:0;position:relative">
<div id="chartDiv"></div>
</div>
<div class="plot-toolbar" style="text-align:center;padding:6px;font-size:.8rem;color:#888">Scroll to zoom | Drag to pan</div>
<div class="data-collapse-wrap"><div class="collapse-header" @click="tableOpen=!tableOpen"><span>Analysis <span style="font-weight:400;font-size:.8rem;color:#64748b">(click to expand)</span></span><span class="arrow-icon" :class="{open:tableOpen}">&#x25BC;</span></div>
<div class="collapse-body" v-show="tableOpen"><table><thead><tr><th>Region</th><th>Count</th><th>Items</th></tr></thead><tbody>
<tr v-for="r in vennRegions"><td>{{r.label}}</td><td>{{r.count}}</td><td style="font-size:0.8rem">{{r.items.join(', ')}}</td></tr>
</tbody></table></div></div>
</div></div></div>
<script>
(function(){
var PALETTE_NAMES=["academic","vibrant","warm","cool","earth"];
var DEFAULT_CONFIG={width:700,height:500,margin:{top:70,right:40,bottom:70,left:40},fontFamily:"Times New Roman",showTitle:true,title:"Venn Diagram",titleFontSize:22};
var DEFAULT_SETS=[{label:"Set A",items:["Gene1","Gene2","Gene3","Gene4","Gene5","GeneShared"]},{label:"Set B",items:["Gene6","Gene7","Gene8","GeneShared","Gene9","Gene10"]},{label:"Set C",items:["Gene11","Gene12","GeneShared","Gene13","Gene14","Gene15"]}];
var VENN_COLORS=["#e74c3c","#3498db","#2ecc71"];
var storageKey="venn_chart_v2";
var app=Vue.createApp({data:function(){
var saved=null;try{saved=JSON.parse(localStorage.getItem(storageKey))}catch(e){}
var ic=JSON.parse(JSON.stringify(DEFAULT_CONFIG)),is=JSON.parse(JSON.stringify(DEFAULT_SETS));
if(saved&&saved.config)ic=Object.assign({},DEFAULT_CONFIG,saved.config);if(saved&&saved.sets)is=saved.sets;
return{config:ic,sets:is,chartDiv:null,tableOpen:false,transform:{k:1,x:0,y:0},_rafId:null,_wheelHandler:null,_mouseDownHandler:null,_mouseMoveHandler:null,_mouseUpHandler:null};
},computed:{vennRegions:function(){var sets=this.sets;var regions=[];
if(sets.length>=2){var a=sets[0].items,b=sets[1].items;var ab=a.filter(function(x){return b.indexOf(x)>=0});var aOnly=a.filter(function(x){return b.indexOf(x)<0});var bOnly=b.filter(function(x){return a.indexOf(x)<0});
if(sets.length>=3){var c=sets[2].items;var abc=ab.filter(function(x){return c.indexOf(x)>=0});var abOnly=ab.filter(function(x){return c.indexOf(x)<0});var acOnly=aOnly.filter(function(x){return c.indexOf(x)>=0});var aOnly2=aOnly.filter(function(x){return c.indexOf(x)<0});var bcOnly=bOnly.filter(function(x){return c.indexOf(x)>=0});var bOnly2=bOnly.filter(function(x){return c.indexOf(x)<0});var cOnly=c.filter(function(x){return a.indexOf(x)<0&&b.indexOf(x)<0});
regions.push({label:"A only",count:aOnly2.length,items:aOnly2},{label:"B only",count:bOnly2.length,items:bOnly2},{label:"C only",count:cOnly.length,items:cOnly},{label:"A&B",count:abOnly.length,items:abOnly},{label:"A&C",count:acOnly.length,items:acOnly},{label:"B&C",count:bcOnly.length,items:bcOnly},{label:"A&B&C",count:abc.length,items:abc})}else{regions.push({label:"A only",count:aOnly.length,items:aOnly},{label:"B only",count:bOnly.length,items:bOnly},{label:"A&B",count:ab.length,items:ab})}}
return regions}},mounted:function(){
var self=this;this.chartDiv=document.getElementById("chartDiv");LangManager.initPage("en",this);
var lb=document.getElementById("langSwitchBtn");if(lb)lb.addEventListener("click",function(){var nl=LangManager.getLang()==="en"?"zh":"en";LangManager.switchLanguage(nl,self);self.drawChart()});
this.$nextTick(function(){this.drawChart()}.bind(this));window.addEventListener("resize",function(){self.drawChart()})
},methods:{
onConfigChange:function(){this.saveState();this.$nextTick(function(){this.drawChart()}.bind(this))},
updateItems:function(i,ev){this.sets[i].items=ev.target.value.split(",").map(function(s){return s.trim()}).filter(function(s){return s});this.onConfigChange()},
applyCSV:function(){},
loadDemo:function(){this.sets=JSON.parse(JSON.stringify(DEFAULT_SETS));this.transform={k:1,x:0,y:0};this.drawChart();this.saveState()},
drawChart:function(){
if(!this.chartDiv)return;var self=this,c=this.chartDiv;c.innerHTML="";this.transform={k:1,x:0,y:0};
var w=this.config.width,h=this.config.height,m=this.config.margin,iW=w-m.left-m.right,iH=h-m.top-m.bottom;
var svg=d3.select(c).append("svg").attr("viewBox","0 0 "+w+" "+h).attr("width",w).attr("height",h).style("width","100%").style("height","100%").style("background","#fff");
svg.append("rect").attr("width",w).attr("height",h).attr("fill","#fff");
var g=svg.append("g").attr("transform","translate("+m.left+","+m.top+")");
var cx=iW/2,cy=iH/2,r=Math.min(iW,iH)*0.3;
var ns=this.sets.length;
if(ns===2){
var dx=r*0.6;
g.append("circle").attr("cx",cx-dx).attr("cy",cy).attr("r",r).attr("fill",VENN_COLORS[0]).attr("opacity",0.5).attr("stroke","#333").attr("stroke-width",1.5);
g.append("circle").attr("cx",cx+dx).attr("cy",cy).attr("r",r).attr("fill",VENN_COLORS[1]).attr("opacity",0.5).attr("stroke","#333").attr("stroke-width",1.5);
var a=self.sets[0].items,b=self.sets[1].items;
var ab=a.filter(function(x){return b.indexOf(x)>=0});
g.append("text").attr("x",cx-dx*1.5).attr("y",cy-r*0.6).style("text-anchor","middle").style("font-size","14px").style("font-family",self.config.fontFamily).style("font-weight","bold").text(self.sets[0].label);
g.append("text").attr("x",cx+dx*1.5).attr("y",cy-r*0.6).style("text-anchor","middle").style("font-size","14px").style("font-family",self.config.fontFamily).style("font-weight","bold").text(self.sets[1].label);
g.append("text").attr("x",cx-dx*1.1).attr("y",cy+8).style("text-anchor","middle").style("font-size","12px").style("font-family",self.config.fontFamily).text(a.length-ab.length);
g.append("text").attr("x",cx+dx*1.1).attr("y",cy+8).style("text-anchor","middle").style("font-size","12px").style("font-family",self.config.fontFamily).text(b.length-ab.length);
g.append("text").attr("x",cx).attr("y",cy+8).style("text-anchor","middle").style("font-size","12px").style("font-family",self.config.fontFamily).text(ab.length)
}else if(ns>=3){
var positions=[{x:cx-r*0.55,y:cy+r*0.3},{x:cx+r*0.55,y:cy+r*0.3},{x:cx,y:cy-r*0.5}];
for(var i=0;i<3;i++){g.append("circle").attr("cx",positions[i].x).attr("cy",positions[i].y).attr("r",r).attr("fill",VENN_COLORS[i]).attr("opacity",0.45).attr("stroke","#333").attr("stroke-width",1.5)}
g.append("text").attr("x",positions[0].x-r*0.5).attr("y",positions[0].y+r*0.9).style("text-anchor","middle").style("font-size","14px").style("font-weight","bold").style("font-family",self.config.fontFamily).text(self.sets[0].label||"A");
g.append("text").attr("x",positions[1].x+r*0.5).attr("y",positions[1].y+r*0.9).style("text-anchor","middle").style("font-size","14px").style("font-weight","bold").style("font-family",self.config.fontFamily).text(self.sets[1].label||"B");
g.append("text").attr("x",positions[2].x).attr("y",positions[2].y-r*0.85).style("text-anchor","middle").style("font-size","14px").style("font-weight","bold").style("font-family",self.config.fontFamily).text(self.sets[2].label||"C");
var a2=self.sets[0].items,b2=self.sets[1].items,c2=self.sets[2].items;
var ab2=a2.filter(function(x){return b2.indexOf(x)>=0});
var ac2=a2.filter(function(x){return c2.indexOf(x)>=0});
var bc2=b2.filter(function(x){return c2.indexOf(x)>=0});
var abc2=ab2.filter(function(x){return c2.indexOf(x)>=0});
g.append("text").attr("x",cx-r*0.3).attr("y",cy+r*0.45).style("text-anchor","middle").style("font-size","11px").style("font-family",self.config.fontFamily).text(a2.length-ab2.length-ac2.length+abc2.length);
g.append("text").attr("x",cx+r*0.3).attr("y",cy+r*0.45).style("text-anchor","middle").style("font-size","11px").style("font-family",self.config.fontFamily).text(b2.length-ab2.length-bc2.length+abc2.length);
g.append("text").attr("x",cx).attr("y",cy-r*0.15).style("text-anchor","middle").style("font-size","11px").style("font-family",self.config.fontFamily).text(c2.length-ac2.length-bc2.length+abc2.length);
g.append("text").attr("x",cx).attr("y",cy+r*0.55).style("text-anchor","middle").style("font-size","10px").style("font-family",self.config.fontFamily).text(ab2.length-abc2.length);
g.append("text").attr("x",cx-r*0.15).attr("y",cy-r*0.25).style("text-anchor","middle").style("font-size","10px").style("font-family",self.config.fontFamily).text(ac2.length-abc2.length);
g.append("text").attr("x",cx+r*0.15).attr("y",cy-r*0.25).style("text-anchor","middle").style("font-size","10px").style("font-family",self.config.fontFamily).text(bc2.length-abc2.length);
g.append("text").attr("x",cx).attr("y",cy+0.1).style("text-anchor","middle").style("font-size","10px").style("font-family",self.config.fontFamily).style("font-weight","bold").text(abc2.length)
}
if(this.config.showTitle){g.append("text").attr("x",iW/2).attr("y",-25).style("text-anchor","middle").style("font-size",this.config.titleFontSize+"px").style("font-family",this.config.fontFamily).style("font-weight","bold").text(this.config.title)}
this.setupInteraction()
},
setupInteraction:function(){
var container=this.chartDiv;if(!container)return;var svg=container.querySelector("svg");if(!svg)return;
if(this._wheelHandler){container.removeEventListener("wheel",this._wheelHandler);container.removeEventListener("mousedown",this._mouseDownHandler);window.removeEventListener("mousemove",this._mouseMoveHandler);window.removeEventListener("mouseup",this._mouseUpHandler)}
if(this._rafId){cancelAnimationFrame(this._rafId);this._rafId=null}
var self=this,transform=this.transform;
function upd(){var w=svg.clientWidth||600,h=svg.clientHeight||600;svg.setAttribute("viewBox",(-transform.x/transform.k)+" "+(-transform.y/transform.k)+" "+(w/transform.k)+" "+(h/transform.k))}
this._wheelHandler=function(e){e.preventDefault();var d=e.deltaY>0?-0.015:0.015;var nk=Math.min(3,Math.max(0.3,transform.k+d));var vx=-transform.x/transform.k,vy=-transform.y/transform.k;transform.k=nk;transform.x=-vx*nk;transform.y=-vy*nk;if(self._rafId)cancelAnimationFrame(self._rafId);self._rafId=requestAnimationFrame(function(){upd();self._rafId=null})};
container.addEventListener("wheel",this._wheelHandler,{passive:false});
var dragging=false,sx,sy,stx,sty;
this._mouseDownHandler=function(e){if(e.button!==0)return;var t=e.target;if(t.closest("circle")||t.closest("text")||t.closest("input")||t.closest(".draggable"))return;dragging=true;sx=e.clientX;sy=e.clientY;stx=transform.x;sty=transform.y;container.style.cursor="grabbing";e.preventDefault()};
container.addEventListener("mousedown",this._mouseDownHandler);
this._mouseMoveHandler=function(e){if(!dragging)return;var r=container.getBoundingClientRect();var w=svg.clientWidth||600,h=svg.clientHeight||600;transform.x=stx+(e.clientX-sx)/r.width*w;transform.y=sty+(e.clientY-sy)/r.height*h;upd()};
window.addEventListener("mousemove",this._mouseMoveHandler);
this._mouseUpHandler=function(){dragging=false;container.style.cursor="grab"};
window.addEventListener("mouseup",this._mouseUpHandler);
container.style.cursor="grab";upd()
},
exportAsSVG:function(){ChartExportHelper.exportChart(this.chartDiv,"svg","venn_diagram")},
exportAsPNG:function(){ChartExportHelper.exportChart(this.chartDiv,"png","venn_diagram")},
exportAsPDF:function(){ChartExportHelper.exportChart(this.chartDiv,"pdf","venn_diagram")},
resetAll:function(){this.sets=JSON.parse(JSON.stringify(DEFAULT_SETS));this.transform={k:1,x:0,y:0};this.drawChart();this.saveState()},
saveState:function(){localStorage.setItem(storageKey,JSON.stringify({config:this.config,sets:this.sets}))}
}});app.mount("#app")})();
</script></body></html>
