<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Heatmap - BioStatPlot</title>
<link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon"/>
<link rel="stylesheet" href="../COMMON/common.css">
<style>
#chartDiv{width:100%;min-height:440px;position:relative;cursor:grab;overflow:hidden;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
#chartDiv:active{cursor:grabbing}
#chartDiv svg{display:block;margin:0 auto;background:white;border-radius:12px;width:100%;height:100%}
.plot-sidebar{height:calc(100vh - 140px);overflow-y:auto}
.plot-sidebar .collapsible-body{padding:12px 16px}
.lang-switch-wrap{display:flex;justify-content:flex-end;margin-bottom:10px}
.plot-main{height:calc(100vh - 140px);overflow:hidden;display:flex;flex-direction:column}
#chartDiv{flex:1;min-height:0}
</style>
<script src="../COMMON/colors.js"></script>
<script src="../COMMON/lang.js"></script>
<script src="../COMMON/common.js"></script>
<script src="../COMMON/defaults.js"></script>
<script src="../COMMON/header.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="common-header"></div>
<script>window.headerConfig={author:"Author: Di Shang Fei Zhu (Hao Xue)"};</script>
<div id="app"><div class="plot-layout">
<div class="plot-sidebar" style="width:340px">
<div class="collapsible-panel" style="margin-bottom:0">
<div class="collapsible-header" style="cursor:default"><span>Heatmap Config</span></div>
<div class="collapsible-body">
<div class="lang-switch-wrap"><button id="langSwitchBtn" class="lang-switch-btn">中文</button></div>
<div class="param-group"><h4>Import Data</h4><div class="data-import-area">
<textarea v-model="csvText" rows="3" placeholder="Gene&#x9;Sample1&#x9;Sample2&#x9;Sample3&#10;GeneA&#x9;2.3&#x9;1.5&#x9;3.1&#10;GeneB&#x9;-1.2&#x9;0.8&#x9;-0.5"></textarea>
<div class="btn-group"><button class="btn btn-sm" @click="applyCSV">Apply</button><button class="btn btn-sm btn-outline" @click="loadDemo">Demo</button><label class="btn btn-sm btn-outline" style="cursor:pointer">File <input type="file" accept=".txt,.csv,.tsv" style="display:none" @change="loadFile"></label></div>
</div></div>
<div class="param-group"><h4>Color Scale</h4>
<div class="param-row"><label>Low Color</label><input type="color" v-model="config.colorLow" @change="onConfigChange"></div>
<div class="param-row"><label>Mid Color</label><input type="color" v-model="config.colorMid" @change="onConfigChange"></div>
<div class="param-row"><label>High Color</label><input type="color" v-model="config.colorHigh" @change="onConfigChange"></div></div>
<div class="param-group"><h4>Options</h4>
<div class="param-row"><label>Show Values</label><select v-model="config.showValues" @change="onConfigChange"><option :value="true">Yes</option><option :value="false">No</option></select></div>
<div class="param-row"><label>Show Title</label><select v-model="config.showTitle" @change="onConfigChange"><option :value="true">Yes</option><option :value="false">No</option></select></div>
<div class="param-row" v-if="config.showTitle"><label>Title</label><input type="text" v-model="config.title" @change="onConfigChange"></div></div>
<div class="param-group"><h4>Export</h4><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
<button class="btn btn-sm" @click="exportAsSVG">SVG</button><button class="btn btn-sm" @click="exportAsPNG">PNG</button><button class="btn btn-sm" @click="exportAsPDF">PDF</button></div>
<button class="btn btn-sm btn-outline" @click="resetAll">Reset</button></div>
</div></div></div>
<div class="plot-main">
<div style="background:#fff;border-radius:16px;padding:8px;flex:1;display:flex;flex-direction:column;min-height:0;position:relative">
<div id="chartDiv"></div>
</div>
<div class="plot-toolbar" style="text-align:center;padding:6px;font-size:.8rem;color:#888">Scroll to zoom | Drag to pan</div>
<div class="data-collapse-wrap"><div class="collapse-header" @click="tableOpen=!tableOpen"><span>Data Preview <span style="font-weight:400;font-size:.8rem;color:#64748b">(click to expand)</span></span><span class="arrow-icon" :class="{open:tableOpen}">&#x25BC;</span></div>
<div class="collapse-body" v-show="tableOpen"><table><thead><tr><th>Gene</th><th v-for="s in colNames">{{s}}</th><th></th></tr></thead><tbody>
<tr v-for="(row,ri) in chartData" :key="ri"><td><input type="text" v-model="row.name" @change="onConfigChange"></td><td v-for="(v,vi) in row.values"><input type="number" v-model.number="row.values[vi]" @change="onConfigChange" step="any"></td><td><button class="btn btn-sm btn-danger" @click="removeRow(ri)">Del</button></td></tr>
</tbody></table><div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-sm" @click="addRow">+ Row</button><button class="btn btn-sm" @click="addCol">+ Column</button></div></div></div>
</div></div></div>
<script>
(function(){
var DEFAULT_CONFIG={width:700,height:500,margin:{top:70,right:40,bottom:120,left:120},fontFamily:"Times New Roman",showTitle:true,title:"Heatmap",titleFontSize:22,showValues:true,colorLow:"#313695",colorMid:"#ffffbf",colorHigh:"#a50026"};
var DEFAULT_DATA=[{name:"GeneA",values:[2.3,1.5,3.1,-0.8,0.5]},{name:"GeneB",values:[-1.2,0.8,-0.5,2.1,1.8]},{name:"GeneC",values:[3.5,2.8,-1.1,0.2,-0.9]},{name:"GeneD",values:[0.5,-0.3,1.2,3.8,2.4]},{name:"GeneE",values:[-2.1,-1.5,0.3,0.8,-0.2]},{name:"GeneF",values:[1.8,2.2,-0.8,-1.2,1.5]},{name:"GeneG",values:[-0.5,0.1,2.5,1.1,-1.8]},{name:"GeneH",values:[2.8,-2.0,1.3,-0.5,3.2]}];
var DEFAULT_COLS=["Sample1","Sample2","Sample3","Sample4","Sample5"];
var storageKey="heatmap_chart_v2";
var app=Vue.createApp({data:function(){
var saved=null;try{saved=JSON.parse(localStorage.getItem(storageKey))}catch(e){}
var ic=JSON.parse(JSON.stringify(DEFAULT_CONFIG)),id=JSON.parse(JSON.stringify(DEFAULT_DATA)),ids=JSON.parse(JSON.stringify(DEFAULT_COLS));
if(saved&&saved.data){if(saved.config)ic=Object.assign({},DEFAULT_CONFIG,saved.config);if(saved.config&&saved.config.margin)ic.margin=Object.assign({},DEFAULT_CONFIG.margin,saved.config.margin);id=saved.data;if(saved.cols)ids=saved.cols}
return{config:ic,chartData:id,colNames:ids,chartDiv:null,csvText:"",tableOpen:false,transform:{k:1,x:0,y:0},_rafId:null,_wheelHandler:null,_mouseDownHandler:null,_mouseMoveHandler:null,_mouseUpHandler:null};
},mounted:function(){
var self=this;this.chartDiv=document.getElementById("chartDiv");LangManager.initPage("en",this);
var lb=document.getElementById("langSwitchBtn");if(lb)lb.addEventListener("click",function(){var nl=LangManager.getLang()==="en"?"zh":"en";LangManager.switchLanguage(nl,self);self.drawChart()});
this.$nextTick(function(){this.drawChart()}.bind(this));window.addEventListener("resize",function(){self.drawChart()})
},methods:{
onConfigChange:function(){this.saveState();this.$nextTick(function(){this.drawChart()}.bind(this))},
applyCSV:function(){var t=this.csvText.trim();if(!t){alert("Enter data");return}var ls=t.split("\n").filter(function(l){return l.trim()});if(ls.length<2){alert("Need header+data");return}var h=ls[0].split("\t");this.colNames=h.slice(1);this.chartData=ls.slice(1).map(function(l){var c=l.split("\t");return{name:c[0].trim(),values:c.slice(1).map(Number)}});this.onConfigChange()},
loadDemo:function(){this.chartData=JSON.parse(JSON.stringify(DEFAULT_DATA));this.colNames=JSON.parse(JSON.stringify(DEFAULT_COLS));this.transform={k:1,x:0,y:0};this.drawChart();this.saveState()},
loadFile:function(e){var f=e.target.files[0];if(!f)return;var self=this;var r=new FileReader();r.onload=function(ev){self.csvText=ev.target.result;self.applyCSV()};r.readAsText(f);e.target.value=""},
addRow:function(){this.chartData.push({name:"Gene"+(this.chartData.length+1),values:this.colNames.map(function(){return (Math.random()-0.5)*6})});this.onConfigChange()},
addCol:function(){this.colNames.push("S"+(this.colNames.length+1));this.chartData.forEach(function(r){r.values.push((Math.random()-0.5)*6)});this.onConfigChange()},
removeRow:function(i){if(this.chartData.length<=1)return;this.chartData.splice(i,1);this.onConfigChange()},
drawChart:function(){
if(!this.chartDiv)return;var self=this,c=this.chartDiv;c.innerHTML="";if(!this.chartData.length)return;this.transform={k:1,x:0,y:0};
var w=this.config.width,h=this.config.height,m=this.config.margin,iW=w-m.left-m.right,iH=h-m.top-m.bottom;
var nr=this.chartData.length,nc=this.colNames.length;
var allV=this.chartData.flatMap(function(d){return d.values});
var vMin=d3.min(allV),vMax=d3.max(allV);
var colorScale=d3.scaleLinear().domain([vMin,(vMin+vMax)/2,vMax]).range([this.config.colorLow,this.config.colorMid,this.config.colorHigh]);
var svg=d3.select(c).append("svg").attr("viewBox","0 0 "+w+" "+h).attr("width",w).attr("height",h).style("width","100%").style("height","100%").style("background","#fff");
svg.append("rect").attr("width",w).attr("height",h).attr("fill","#fff");
var g=svg.append("g").attr("transform","translate("+m.left+","+m.top+")");
var cellW=iW/nc,cellH=iH/nr;
this.chartData.forEach(function(row,ri){row.values.forEach(function(v,ci){
g.append("rect").attr("x",ci*cellW).attr("y",ri*cellH).attr("width",cellW).attr("height",cellH).attr("fill",colorScale(v)).attr("stroke","#fff").attr("stroke-width",1);
if(self.config.showValues){g.append("text").attr("x",ci*cellW+cellW/2).attr("y",ri*cellH+cellH/2).attr("dy","0.35em").style("text-anchor","middle").style("font-size","10px").style("font-family",self.config.fontFamily).style("fill",Math.abs(v)>(vMax-vMin)*0.5?"#fff":"#333").text(v.toFixed(2))}
})});
this.chartData.forEach(function(row,ri){g.append("text").attr("x",-6).attr("y",ri*cellH+cellH/2).attr("dy","0.35em").style("text-anchor","end").style("font-size","10px").style("font-family",self.config.fontFamily).text(row.name)});
this.colNames.forEach(function(cn,ci){g.append("text").attr("x",ci*cellW+cellW/2).attr("y",iH+16).style("text-anchor","middle").style("font-size","10px").style("font-family",self.config.fontFamily).attr("transform","rotate(-45,"+(ci*cellW+cellW/2)+","+(iH+16)+")").text(cn)});
if(this.config.showTitle){g.append("text").attr("x",iW/2).attr("y",-25).style("text-anchor","middle").style("font-size",this.config.titleFontSize+"px").style("font-family",this.config.fontFamily).style("font-weight","bold").text(this.config.title)}
this.setupInteraction()
},
setupInteraction:function(){
var container=this.chartDiv;if(!container)return;var svg=container.querySelector("svg");if(!svg)return;
if(this._wheelHandler){container.removeEventListener("wheel",this._wheelHandler);container.removeEventListener("mousedown",this._mouseDownHandler);window.removeEventListener("mousemove",this._mouseMoveHandler);window.removeEventListener("mouseup",this._mouseUpHandler)}
if(this._rafId){cancelAnimationFrame(this._rafId);this._rafId=null}
var self=this,transform=this.transform;
function upd(){var w=svg.clientWidth||600,h=svg.clientHeight||600;svg.setAttribute("viewBox",(-transform.x/transform.k)+" "+(-transform.y/transform.k)+" "+(w/transform.k)+" "+(h/transform.k))}
this._wheelHandler=function(e){e.preventDefault();var d=e.deltaY>0?-0.015:0.015;var nk=Math.min(3,Math.max(0.3,transform.k+d));var vx=-transform.x/transform.k,vy=-transform.y/transform.k;transform.k=nk;transform.x=-vx*nk;transform.y=-vy*nk;if(self._rafId)cancelAnimationFrame(self._rafId);self._rafId=requestAnimationFrame(function(){upd();self._rafId=null})};
container.addEventListener("wheel",this._wheelHandler,{passive:false});
var dragging=false,sx,sy,stx,sty;
this._mouseDownHandler=function(e){if(e.button!==0)return;var t=e.target;if(t.closest("text")||t.closest("input")||t.closest(".draggable")||t.closest(".chart-legend"))return;dragging=true;sx=e.clientX;sy=e.clientY;stx=transform.x;sty=transform.y;container.style.cursor="grabbing";e.preventDefault()};
container.addEventListener("mousedown",this._mouseDownHandler);
this._mouseMoveHandler=function(e){if(!dragging)return;var r=container.getBoundingClientRect();var w=svg.clientWidth||600,h=svg.clientHeight||600;transform.x=stx+(e.clientX-sx)/r.width*w;transform.y=sty+(e.clientY-sy)/r.height*h;upd()};
window.addEventListener("mousemove",this._mouseMoveHandler);
this._mouseUpHandler=function(){dragging=false;container.style.cursor="grab"};
window.addEventListener("mouseup",this._mouseUpHandler);
container.style.cursor="grab";upd()
},
exportAsSVG:function(){ChartExportHelper.exportChart(this.chartDiv,"svg","heatmap")},
exportAsPNG:function(){ChartExportHelper.exportChart(this.chartDiv,"png","heatmap")},
exportAsPDF:function(){ChartExportHelper.exportChart(this.chartDiv,"pdf","heatmap")},
resetAll:function(){this.config=JSON.parse(JSON.stringify(DEFAULT_CONFIG));this.chartData=JSON.parse(JSON.stringify(DEFAULT_DATA));this.colNames=JSON.parse(JSON.stringify(DEFAULT_COLS));this.transform={k:1,x:0,y:0};this.drawChart();this.saveState()},
saveState:function(){localStorage.setItem(storageKey,JSON.stringify({data:this.chartData,config:this.config,cols:this.colNames}))}
}});app.mount("#app")})();
</script></body></html>
