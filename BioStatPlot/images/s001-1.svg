<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c9dd1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c9dd1" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c9dd1"/>
      <stop offset="100%" stop-color="#5b8bd0"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8bd0"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5f92"/>
      <stop offset="100%" stop-color="#1f4068"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8bd0"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c9dd1"/>
      <stop offset="100%" stop-color="#5b8bd0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5"
                    flood-color="#1f4068" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="700" height="700" fill="#ffffff"/>

  <g stroke="#d8e2ec" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7">
    <line x1="60" y1="140" x2="640" y2="140"/>
    <line x1="60" y1="240" x2="640" y2="240"/>
    <line x1="60" y1="340" x2="640" y2="340"/>
    <line x1="60" y1="440" x2="640" y2="440"/>
    <line x1="60" y1="540" x2="640" y2="540"/>
  </g>

  <path d="M 60,590 C 140,590 260,190 350,190 C 440,190 560,590 640,590 Z"
        fill="url(#bellGrad)"/>
  <path d="M 60,590 C 140,590 260,190 350,190 C 440,190 560,590 640,590"
        fill="none" stroke="#4a6fa5" stroke-width="3" stroke-opacity="0.55"/>

  <line x1="60" y1="590" x2="640" y2="590"
        stroke="#1f4068" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <rect x="90"  y="440" width="80" height="150" rx="6" fill="url(#bar1)"/>
    <rect x="200" y="340" width="80" height="250" rx="6" fill="url(#bar2)"/>
    <rect x="310" y="240" width="80" height="350" rx="6" fill="url(#bar3)"/>
    <rect x="420" y="330" width="80" height="260" rx="6" fill="url(#bar4)"/>
    <rect x="530" y="420" width="80" height="170" rx="6" fill="url(#bar5)"/>
  </g>

  <g stroke="#e67700" stroke-width="4" stroke-linecap="round">
    <line x1="130" y1="405" x2="130" y2="475"/>
    <line x1="110" y1="405" x2="150" y2="405"/>
    <line x1="110" y1="475" x2="150" y2="475"/>

    <line x1="240" y1="300" x2="240" y2="380"/>
    <line x1="220" y1="300" x2="260" y2="300"/>
    <line x1="220" y1="380" x2="260" y2="380"/>

    <line x1="350" y1="210" x2="350" y2="270"/>
    <line x1="330" y1="210" x2="370" y2="210"/>
    <line x1="330" y1="270" x2="370" y2="270"/>

    <line x1="460" y1="295" x2="460" y2="365"/>
    <line x1="440" y1="295" x2="480" y2="295"/>
    <line x1="440" y1="365" x2="480" y2="365"/>

    <line x1="570" y1="390" x2="570" y2="450"/>
    <line x1="550" y1="390" x2="590" y2="390"/>
    <line x1="550" y1="450" x2="590" y2="450"/>
  </g>
</svg>