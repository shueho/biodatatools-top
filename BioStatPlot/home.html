<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioStatPlot - BioDataTools</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 页眉（与主站一致） -->
    <header>
        <div class="header-wrap">
            <div class="site-title">
                <h1>BioStatPlot</h1>
                <div class="author">作者：地上飞猪</div>
            </div>
            <div>
                <a href="https://space.bilibili.com/33053326" target="_blank" class="bilibili-link">前往B站主页</a>
                <a href="https://github.com/shueho/BioDataTools" target="_blank" class="github-link">GitHub 项目</a>
                <a href="../index.html" class="back-home">返回BioDataTools</a>
            </div>
        </div>
    </header>

    <!-- 侧边栏切换按钮 -->
    <button class="toggle-side-btn" id="toggleSideBtn">⇆</button>

    <!-- 左侧导航栏 -->
    <nav class="side-nav" id="sideNav">
        <h4>📚 绘图工具导航</h4>
        <ul id="navList"></ul>
    </nav>

    <!-- 主内容区 -->
    <div class="main">
        <div class="intro">
            <h2>BioStatPlot</h2>
            <p>生物学在线统计分析与绘图合集</p>
        </div>

        <!-- 搜索框 -->
        <div class="search-bar">
            <input type="text" id="toolSearchInput" placeholder="🔍 输入工具名称或描述中的关键词...">
        </div>

        <div id="toolList" class="plot-grid"></div>
    </div>

    <!-- 页脚占位符 -->
    <div id="common-footer"></div>

    <script src="COMMON/footer.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>

    <!-- 侧边栏切换交互 -->
    <script>
        const toggleSideBtn = document.getElementById('toggleSideBtn');
        const sideNav = document.querySelector('.side-nav');
        const mainWrap = document.querySelector('.main');

        toggleSideBtn.addEventListener('click', function() {
            sideNav.classList.toggle('hidden');
            mainWrap.classList.toggle('full-width');
        });
    </script>
</body>
</html>
