<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类柱状图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>分类柱状图</h2>
            <p>大类中嵌套小类，不同大类使用不同颜色。支持竖向/横向切换、范围棒与误差值棒。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：指定数据列与排序</div>

            <div class="param-panel">
                <div class="param-panel-title">数据列</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>大类列</label>
                        <select id="xColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>小类列</label>
                        <select id="groupColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>数值列</label>
                        <select id="yColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                </div>
                <div style="font-size:12px;color:#999;margin-top:8px;">
                    每个大类下可包含若干小类，不同大类的小类可不同。颜色按大类分配。
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">排序与分组顺序</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>排序依据</label>
                        <select id="sortBy" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>排序方向</label>
                        <select id="sortDir">
                            <option value="desc" selected>从大到小</option>
                            <option value="asc">从小到大</option>
                        </select>
                    </div>
                </div>

                <div class="param-inline" style="margin-top:10px;">
                    <label class="mini-check">
                        <input type="checkbox" id="bigCatSorted" checked data-redraw>
                        按大类分组排序
                    </label>
                    <span style="font-size:12px;color:#999;">
                        勾选：大类按顺序，大类内小类按排序依据排；不勾选：所有小类一起排（颜色错杂）
                    </span>
                </div>

                <div class="param-inline" style="margin-top:8px;">
                    <label>大类顺序
                        <input type="text" id="groupOrder" value="" placeholder="如 B,A,C" style="width:280px;">
                    </label>
                    <span style="font-size:12px;color:#999;">留空按出现顺序；未列出的附后</span>
                </div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>

            <div class="param-panel">
                <div class="param-panel-title">大类色板</div>
                <div id="paletteDropdownContainer"></div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                    <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
                </div>
            </div>

            <div id="colorAssignContainer"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>
            <div id="legendSettingsPanel"></div>
            <div id="axisPanelContainer"></div>

            <div class="param-panel">
                <div class="param-panel-title">柱形图设置</div>

                <div class="param-grid cols-4">
                    <div class="param-item"><label>柱间距</label>
                        <input type="number" id="barInnerGap" value="0.15" min="0" max="0.9" step="0.05" data-redraw></div>
                    <div class="param-item"><label>组间距</label>
                        <input type="number" id="barOuterGap" value="0.3" min="0" max="0.9" step="0.05" data-redraw></div>
                    <div class="param-item"><label>柱宽比例</label>
                        <input type="number" id="barWidthScale" value="1" min="0.2" max="1" step="0.05" data-redraw></div>
                    <div class="param-item"><label>柱描边宽度</label>
                        <input type="number" id="barStrokeWidth" value="0" min="0" max="4" step="0.5" data-redraw></div>
                    <div class="param-item"><label>柱描边色</label>
                        <input type="color" id="barStrokeColor" value="#ffffff" data-redraw></div>
                </div>

                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="barShowValue" data-redraw>在柱顶显示数值</label>
                    <label>字号
                        <input type="number" id="barValueFontSize" value="12" min="6" max="24" style="width:70px;" data-redraw>
                    </label>
                </div>

                <div class="param-inline" style="margin-top:14px;">
                    <label>条带样式
                        <select id="stripStyle" data-redraw>
                            <option value="byBar" selected>同柱子色</option>
                            <option value="uniform">统一色</option>
                            <option value="none">不显示</option>
                        </select>
                    </label>
                    <label>填充色
                        <input type="color" id="stripColor" value="#eef2f7" data-redraw>
                    </label>
                    <label>透明度
                        <input type="number" id="stripOpacity" value="1" min="0" max="1" step="0.05" style="width:70px;" data-redraw>
                    </label>
                    <label>轮廓色
                        <input type="color" id="stripStrokeColor" value="#c8d2de" data-redraw>
                    </label>
                    <label>轮廓宽度
                        <input type="number" id="stripStrokeWidth" value="1" min="0" max="4" step="0.5" style="width:70px;" data-redraw>
                    </label>
                    <label>文字色
                        <input type="color" id="stripTextColor" value="#1f4068" data-redraw>
                    </label>
                </div>
            </div>

            <div id="errorBarPanelContainer"></div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
<script src="../COMMON/donate-widget-left.js"></script>

    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-axis.js"></script>
    <script src="../COMMON/script/plot-errorbar.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/bar-common.js"></script>
    <script src="../COMMON/script/008.js"></script>
</body>
</html>
