<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花瓣图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>花瓣图</h2>
            <p>每个花瓣的角度和半径同时反映占比，形成花瓣状分布。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：指定数据列与排序</div>

            <div class="param-panel">
                <div class="param-panel-title">数据列</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>分类列</label>
                        <select id="catColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>数值列</label>
                        <select id="valColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">排序</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>排序依据</label>
                        <select id="sortBy" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>排序方向</label>
                        <select id="sortDir">
                            <option value="desc" selected>从大到小</option>
                            <option value="asc">从小到大</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>

            <div class="param-panel">
                <div class="param-panel-title">分类色板</div>
                <div id="paletteDropdownContainer"></div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                    <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
                </div>
            </div>

            <div id="colorAssignContainer"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>
            <div id="legendSettingsPanel"></div>

            <div class="param-panel">
                <div class="param-panel-title">标签</div>

                <div class="param-inline">
                    <label>字号
                        <input type="number" id="labelFontSize" value="14" min="8" max="36" data-redraw>
                    </label>
                    <label class="mini-check"><input type="checkbox" id="labelBold" data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="labelItalic" data-redraw>斜</label>
                </div>

                <div class="param-inline">
                    <label>分类名位置
                        <select id="namePosition" data-redraw>
                            <option value="none">不显示</option>
                            <option value="inside" selected>圆内（贴花瓣）</option>
                            <option value="outside">圆外（超出同心环）</option>
                        </select>
                    </label>
                </div>

                <div class="param-inline">
                    <label>值标签位置
                        <select id="valuePosition" data-redraw>
                            <option value="none" selected>不显示</option>
                            <option value="inside">圆内（贴花瓣）</option>
                            <option value="outside">圆外（超出同心环）</option>
                        </select>
                    </label>
                    <label>值内容
                        <select id="valueContent" data-redraw>
                            <option value="pct" selected>百分比</option>
                            <option value="value">原始值</option>
                            <option value="pct_value">百分比 + 原始值</option>
                        </select>
                    </label>
                    <label>圆外偏移
                        <input type="number" id="labelOffset" value="20" min="0" max="200" step="5" style="width:70px;" data-redraw>px
                    </label>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">花瓣图设置</div>

                <div style="font-size:12px;font-weight:700;color:#4a6784;margin:4px 0 8px 0;">花瓣形状</div>

                <div class="param-grid cols-4">
                    <div class="param-item"><label>最大半径</label>
                        <input type="number" id="outerRadius" value="220" min="40" max="1000" step="10" data-redraw></div>
                    <div class="param-item"><label>内半径</label>
                        <input type="number" id="innerRadius" value="0" min="0" max="500" step="5" data-redraw></div>
                    <div class="param-item">
                        <label>半径模式</label>
                        <select id="radiusScale" data-redraw>
                            <option value="linear" selected>正比于占比</option>
                            <option value="sqrt">正比于占比平方根</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>角度模式</label>
                        <select id="angleMode" data-redraw>
                            <option value="proportional" selected>正比于占比</option>
                            <option value="equal">等额</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>排布方向</label>
                        <select id="pieDirection" data-redraw>
                            <option value="clockwise" selected>顺时针</option>
                            <option value="counterclockwise">逆时针</option>
                        </select>
                    </div>
                    <div class="param-item"><label>起始角度(°)</label>
                        <input type="number" id="startAngle" value="0" min="0" max="360" step="5" data-redraw></div>
                    <div class="param-item"><label>花瓣间隙(°)</label>
                        <input type="number" id="gapAngle" value="2" min="0" max="30" step="0.5" data-redraw></div>
                    <div class="param-item"><label>花瓣描边</label>
                        <input type="color" id="sliceStroke" value="#ffffff" data-redraw></div>
                    <div class="param-item"><label>描边宽度</label>
                        <input type="number" id="strokeWidth" value="1.5" min="0" max="6" step="0.5" data-redraw></div>
                </div>

                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="mergeSmall" data-redraw>合并小花瓣</label>
                    <label>阈值
                        <input type="number" id="mergeThreshold" value="3" min="0" max="30" step="0.5" style="width:70px;" data-redraw>%
                    </label>
                </div>

                <div style="font-size:12px;font-weight:700;color:#4a6784;margin:16px 0 8px 0;">径向轴与刻度值</div>

                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>同心环</label>
                        <select id="showRings" data-redraw>
                            <option value="none" selected>不显示</option>
                            <option value="all">显示</option>
                        </select>
                    </div>
                    <div class="param-item"><label>环数</label>
                        <input type="number" id="ringLevels" value="4" min="1" max="20" data-redraw></div>
                    <div class="param-item"><label>环颜色</label>
                        <input type="color" id="ringColor" value="#d8e2ec" data-redraw></div>
                    <div class="param-item"><label>环宽度</label>
                        <input type="number" id="ringWidth" value="1" min="0" max="6" step="0.5" data-redraw></div>
                    <div class="param-item">
                        <label>径向轴线</label>
                        <select id="showRadial" data-redraw>
                            <option value="none" selected>不显示</option>
                            <option value="all">显示</option>
                        </select>
                    </div>
                    <div class="param-item"><label>轴颜色</label>
                        <input type="color" id="axisColor" value="#d8e2ec" data-redraw></div>
                    <div class="param-item"><label>轴宽度</label>
                        <input type="number" id="axisWidth" value="1" min="0" max="6" step="0.5" data-redraw></div>
                    <div class="param-item">
                        <label>刻度位置</label>
                        <select id="scalePos" data-redraw>
                            <option value="none" selected>不显示</option>
                            <option value="first">仅第一根轴</option>
                            <option value="all">每根轴</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>刻度内容</label>
                        <select id="scaleType" data-redraw>
                            <option value="percent" selected>占比(%)</option>
                            <option value="original">原始值</option>
                        </select>
                    </div>
                    <div class="param-item"><label>小数位</label>
                        <input type="number" id="scaleDecimals" value="0" min="0" max="4" step="1" data-redraw></div>
                </div>

                <div class="param-inline" style="margin-top:8px;">
                    <label>刻度字号
                        <input type="number" id="scaleFontSize" value="12" min="6" max="24" data-redraw>
                    </label>
                    <label class="mini-check"><input type="checkbox" id="scaleBold" data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="scaleItalic" data-redraw>斜</label>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/004.js"></script>
</body>
</html>
