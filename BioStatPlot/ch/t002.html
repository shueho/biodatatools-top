<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进化树对比图（纠缠图） - BioDataTools</title>
<link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="../COMMON/tree/tree-theme.css">
<style>
  #chartPreview { display:block; padding:8px; min-height:auto; }
  #tgSvg { display:block; width:100%; height:auto; background:#fff; }
  #tgLegend .tg-swatch { display:inline-block; width:20px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; }
  #tgSwapPanel .tg-chg { display:block; color:#dc3545; font-weight:700; }
  #tgSwapPanel .tg-chg small { color:#888; font-weight:400; margin-left:8px; }
</style>
</head>
<body>
<div id="common-header"></div>
<div class="main">
  <div class="page-intro">
    <h2>进化树对比图（纠缠图）</h2>
    <p>导入两棵树和分组文件，点击内部节点旋转子分支，让连线交叉最少，导出调整后的树文件。</p>
  </div>
  <div class="step-card" id="step1">
    <div class="step-title">第一步：导入左树</div>
    <div id="leftImportHost"></div>
    <div id="leftMsg" class="tip-text"></div>
  </div>
  <div class="step-card" id="step2">
    <div class="step-title">第二步：导入右树</div>
    <div id="rightImportHost"></div>
    <div id="rightMsg" class="tip-text"></div>
  </div>
  <div class="step-card" id="step3">
    <div class="step-title">第三步：导入分组表（可选）</div>
    <div id="groupsImportHost"></div>
    <div id="groupsMsg" class="tip-text"></div>
    <div id="groupStyleHost" style="margin-top:16px;"></div>
  </div>
  <div class="step-card" id="step4">
    <div class="step-title">第四步：布局设置</div>

    <div class="param-panel">
      <div class="param-panel-title">全局设置</div>
      <div class="param-grid cols-4">
        <div class="param-item"><label>全局字体</label>
          <select id="tgFontFamily">
            <option value="Times New Roman" selected>Times New Roman</option>
            <option value="Arial">Arial</option>
            <option value="Helvetica">Helvetica</option>
            <option value="Calibri">Calibri</option>
            <option value="Georgia">Georgia</option>
            <option value="Courier New">Courier New</option>
            <option value="SimSun">宋体</option>
            <option value="SimHei">黑体</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="KaiTi">楷体</option>
          </select></div>
        <div class="param-item"><label>叶行高</label><input type="number" id="tgLeafRowH" value="22" min="6" max="60" step="1"></div>
        <div class="param-item"><label>树宽</label><input type="number" id="tgTreeWidth" value="280" min="80" max="800" step="10"></div>
        <div class="param-item"><label>两树间距</label>
          <input type="number" id="tgGapWidth" value="460" min="0" max="2000" step="10" style="width:70px;" readonly>
          <label class="mini-check"><input type="checkbox" id="tgGapAuto" checked> 自动</label></div>
      </div>
    </div>

    <div class="param-panel">
      <div class="param-panel-title">进化树设置</div>
      <div class="param-grid cols-4">
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgIgnoreLength" checked> 忽略枝长</label></div>
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgHideLabels"> 隐藏叶标签</label></div>
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgShowGuides" checked> 显示引导线</label></div>
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgMergeMatched"> 水平标签合并居中</label></div>
        <div class="param-item"><label>标签排序</label>
          <select id="tgSortMode">
            <option value="none">不排序</option>
            <option value="labelAsc">按标签升序</option>
            <option value="labelDesc">按标签降序</option>
            <option value="group">按分组</option>
          </select></div>
        <div class="param-item"><label>纵向对齐</label>
          <select id="tgHeightMode">
            <option value="adaptive">自适应高度</option>
            <option value="uniform">统一行距</option>
            <option value="match">标签匹配</option>
          </select></div>
        <div class="param-item"><label>标签字号</label><input type="number" id="tgLabelFontSize" value="13" min="6" max="40" step="1"></div>
        <div class="param-item"><label>标签样式</label>
          <label class="mini-check"><input type="checkbox" id="tgLabelBold"> 加粗</label>
          <label class="mini-check"><input type="checkbox" id="tgLabelItalic"> 斜体</label></div>
        <div class="param-item"><label>标签对齐</label>
          <select id="tgLabelAlignMode">
            <option value="none">标签位于节点处</option>
            <option value="outer">标签靠两侧对齐</option>
            <option value="center">标签居中对齐</option>
            <option value="inner">标签靠中间对齐</option>
          </select></div>
        <div class="param-item"><label>标签偏移</label>
          <input type="number" id="tgLabelOffset" value="0" min="-200" max="200" step="1"></div>
      </div>
    </div>

    <div class="param-panel">
      <div class="param-panel-title">匹配连线设置</div>
      <div class="param-grid cols-4">
        <div class="param-item"><label>连线显示</label>
          <select id="tgLinkMode">
            <option value="all">全部显示</option>
            <option value="nonHorizontal">只显示非水平匹配</option>
            <option value="none">关闭连线</option>
          </select></div>
        <div class="param-item"><label>连线宽度</label><input type="number" id="tgLinkWidth" value="1.5" min="0.5" max="8" step="0.1"></div>
        <div class="param-item"><label>连线透明度</label><input type="number" id="tgLinkOpacity" value="0.65" min="0" max="1" step="0.05"></div>
        <div class="param-item"><label>曲线程度</label><input type="number" id="tgLinkCurve" value="0.5" min="0" max="1" step="0.05"></div>
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgLinkMatchBranch"> 连线宽度与标签间距等宽</label></div>
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgLinkDashed"> 连线为虚线</label></div>
        <div class="param-item"><label>线条对齐</label>
          <select id="tgLinkAlignMode">
            <option value="label">与标签固定距离</option>
            <option value="alignStart">起止位置对齐</option>
            <option value="node">对齐节点处</option>
          </select></div>
        <div class="param-item"><label>线条偏移</label>
          <input type="number" id="tgLinkPadding" value="8" min="-100" max="100" step="1"></div>
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgHighlightMismatch" checked> 深度不一致标色</label></div>
        <div class="param-item"><label>深度容差</label>
          <input type="number" id="tgDepthTolerance" value="" min="0" step="any" placeholder="0.1"></div>
      </div>
      <div class="info-box">同名叶的相对深度差超过容差时，连线标红。</div>
    </div>

    <div class="param-panel">
      <div class="param-panel-title">拓扑不匹配设置</div>
      <div class="param-grid cols-4">
        <div class="param-item"><label class="mini-check"><input type="checkbox" id="tgTopoHighlight" checked> 拓扑不一致标色（树枝）</label></div>
      </div>
      <div class="info-box">彩色树枝表示该处拓扑与另一棵树不同；颜色相同表示同一处分化。</div>
    </div>
  </div>

  <div class="step-card" id="step5">
    <div class="step-title">第五步：预览与导出</div>
    <div class="result-toolbar">
      <button class="btn" type="button" data-export="left">导出左树</button>
      <button class="btn" type="button" data-export="right">导出右树</button>
      <button class="btn" type="button" data-export="svg">导出SVG</button>
      <button class="btn" type="button" data-export="png">导出PNG</button>
      <label class="mini-check"><input type="checkbox" id="tgIncludeMeta" checked> 导出树文件包含元数据</label>
      <label class="mini-check"><input type="checkbox" id="tgExportTopoHl"> 导出图片展示拓扑变化</label>
      <span class="spacer"></span>
      <span id="tgMsg" class="tip-text"></span>
    </div>
    <div class="info-box" style="margin:8px 0 12px;line-height:1.75;">
      <b>说明：</b>深度一致只说明该叶在两侧位置相近，<b>不代表拓扑相同</b>。彩色树枝标出的是拓扑发生变化的位置；如果某个节点以下没有颜色，说明这一段局部结构在两棵树中是一致的。建议先排序标签，再调整节点。
    </div>
    <div id="tgLegend" class="param-inline"></div>
    <div class="chart-preview" id="chartPreview">
      <svg id="tgSvg" preserveAspectRatio="xMidYMin meet"></svg>
    </div>
  </div>
</div>
<div class="node-action-panel" id="tgActionPanel">
  <div class="nap-title" id="tgApTitle">旋转此节点的子分支？</div>
  <button class="nap-btn" type="button" data-tgact="confirm">确认旋转</button>
  <button class="nap-btn" type="button" data-tgact="align">自动对齐</button>
  <button class="nap-btn" type="button" data-tgact="undo" disabled>恢复上次调整</button>
  <button class="nap-btn nap-close" type="button" data-tgact="cancel">取消</button>
</div>
<div class="node-action-panel" id="tgSwapPanel" style="display:none;min-width:180px;max-width:320px;">
  <div class="nap-title" id="tgSwapTitle">标签变化</div>
  <div id="tgSwapBody" style="max-height:260px;overflow:auto;font-size:13px;line-height:1.9;padding:2px 4px 6px;"></div>
</div>

<div id="common-footer"></div>
<script src="../COMMON/script/plot-header.js"></script>
<script src="../COMMON/script/plot-footer.js"></script>
<script>
  window.headerConfig = {};
</script>
<script src="../COMMON/tree/tree-bootstrap.js"></script>
<script src="../COMMON/tree/tree-i18n.js"></script>
<script src="../COMMON/tree/tree-common.js"></script>
<script src="../COMMON/tree/tree-text.js"></script>
<script src="../COMMON/tree/tree-palette.js"></script>
<script src="../COMMON/tree/tree-style-types.js"></script>
<script src="../COMMON/tree/tree-core.js"></script>
<script src="../COMMON/tree/tree-parser.js"></script>
<script src="../COMMON/tree/tree-traverse.js"></script>
<script src="../COMMON/tree/tree-common-widgets.js"></script>
<script src="../COMMON/tree/tree-ui-shared.js"></script>
<script src="../COMMON/tree/t002.js"></script>
<script src="../../COMMON/donate-widget.js"></script>
</body>
</html>
