<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分组柱状图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>分组柱状图</h2>
            <p>按分类绘制柱状图，可选用分组变量并排展示，支持竖向 / 横向切换，支持范围棒与误差值棒。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：指定数据列</div>
            <div class="param-group">
                <label>分类列：</label>
                <select id="xColSel" disabled><option>— 请先导入数据 —</option></select>
                <label>分组列：</label>
                <select id="groupColSel" disabled><option>— 请先导入数据 —</option></select>
                <label>数值列：</label>
                <select id="yColSel" disabled><option>— 请先导入数据 —</option></select>
            </div>
            <div class="tip-text" style="font-size:13px;color:#999;margin-top:8px;">
                分组列可留空，留空时即为普通柱形图。图表方向（竖向 / 横向）在第四步的坐标轴设置中切换。
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>
            <div class="param-group" style="margin-top:0;">
                <label>排序依据：</label>
                <select id="sortBy" disabled><option>— 请先导入数据 —</option></select>
                <label>排序方向：</label>
                <select id="sortDir">
                    <option value="asc" selected>从小到大</option>
                    <option value="desc">从大到小</option>
                </select>
            </div>
            <div style="font-size:14px;font-weight:700;color:#1f4068;margin:16px 0 4px;">分类色板</div>
            <div id="paletteDropdownContainer"></div>
            <div class="param-inline" style="margin-top:8px;">
                <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
            </div>
            <div id="colorAssignContainer" style="margin-top:16px;"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div class="param-panel">
                <div class="param-panel-title">画布尺寸</div>
                <div class="param-grid cols-4">
                    <div class="param-item"><label>宽度(px)</label><input type="number" id="chartWidth" value="760" min="300" data-redraw></div>
                    <div class="param-item"><label>高度(px)</label><input type="number" id="chartHeight" value="600" min="300" data-redraw></div>
                </div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="showCanvasBorder" checked data-redraw>显示画布边框</label>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">字体样式</div>
                <div class="font-row">
                    <span class="font-label">字体</span>
                    <select id="fontFamily" data-redraw>
                        <option value="Times New Roman" selected>Times New Roman</option>
                        <option value="Arial">Arial</option>
                        <option value="Calibri">Calibri</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Microsoft YaHei">微软雅黑</option>
                    </select>
                </div>
                <div class="font-row">
                    <span class="font-label">轴刻度值</span>
                    <input type="number" id="axisTickFontSize" value="14" min="6" max="36">
                    <label class="mini-check"><input type="checkbox" id="axisTickBold">粗</label>
                    <label class="mini-check"><input type="checkbox" id="axisTickItalic">斜</label>
                </div>
                <div class="font-row">
                    <span class="font-label">轴标题</span>
                    <input type="number" id="axisTitleFontSize" value="16" min="6" max="48">
                    <label class="mini-check"><input type="checkbox" id="axisTitleBold">粗</label>
                    <label class="mini-check"><input type="checkbox" id="axisTitleItalic">斜</label>
                </div>
                <div class="font-row">
                    <span class="font-label">图例</span>
                    <input type="number" id="legendFontSize" value="15" min="8" max="36" data-redraw>
                    <label class="mini-check"><input type="checkbox" id="legendBold" data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="legendItalic" data-redraw>斜</label>
                </div>
                <div class="font-row">
                    <span class="font-label">图例标题</span>
                    <input type="number" id="legendTitleFontSize" value="15" min="8" max="36" data-redraw>
                    <label class="mini-check"><input type="checkbox" id="legendTitleBold" checked data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="legendTitleItalic" data-redraw>斜</label>
                </div>
                <div class="font-row">
                    <span class="font-label">标题</span>
                    <input type="number" id="titleFontSize" value="22" min="10" max="48" data-redraw>
                    <label class="mini-check"><input type="checkbox" id="titleBold" checked data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="titleItalic" data-redraw>斜</label>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">组件控制</div>
<div class="font-row">
    <span class="font-label">图例</span>
    <label class="mini-check"><input type="checkbox" id="showLegend" checked data-redraw>显示</label>
    <input type="hidden" id="legendPosition" value="right">
    <label>每行显示：
        <input type="number" id="legendMaxPerLine" value="1" min="1" max="50" step="1" style="width:60px;" data-redraw>
    </label>
</div>
                <div class="font-row">
                    <span class="font-label">图例标题</span>
                    <label class="mini-check"><input type="checkbox" id="showLegendTitle" checked data-redraw>显示</label>
                    <label>内容：<input type="text" id="legendTitle" value="" style="width:220px;" data-redraw></label>
                </div>
                <div class="font-row">
                    <span class="font-label">标题</span>
                    <label class="mini-check"><input type="checkbox" id="showTitle" data-redraw>显示</label>
                    <label>位置：
                        <select id="titlePosition" data-redraw>
                            <option value="top-center" selected>顶部居中</option>
                            <option value="top-left">顶部左</option>
                            <option value="top-right">顶部右</option>
                            <option value="middle-center">中部居中</option>
                            <option value="middle-left">中部左</option>
                            <option value="middle-right">中部右</option>
                            <option value="bottom-center">底部居中</option>
                            <option value="bottom-left">底部左</option>
                            <option value="bottom-right">底部右</option>
                        </select>
                    </label>
                    <label>内容：<input type="text" id="chartTitle" value="BioDataTools" style="width:220px;" data-redraw></label>
                    <label>间距(px)：
                        <input type="number" id="titleSpacing" value="30" min="0" max="200" step="5" style="width:70px;" data-redraw>
                    </label>
                </div>
            </div>

            <!-- 坐标轴设置（含"图表方向"）由 plot-axis.js 动态生成 -->
            <div id="axisPanelContainer"></div>

            <div class="param-panel">
                <div class="param-panel-title">柱形设置</div>
                <div class="param-grid cols-4">
                    <div class="param-item"><label>同组柱间距</label><input type="number" id="barInnerGap" value="0.15" min="0" max="0.9" step="0.05" data-redraw></div>
                    <div class="param-item"><label>组间距</label><input type="number" id="barOuterGap" value="0.3" min="0" max="0.9" step="0.05" data-redraw></div>
                    <div class="param-item"><label>柱宽比例</label><input type="number" id="barWidthScale" value="1" min="0.2" max="1" step="0.05" data-redraw></div>
                    <div class="param-item"><label>柱描边宽度</label><input type="number" id="barStrokeWidth" value="0" min="0" max="4" step="0.5" data-redraw></div>
                    <div class="param-item"><label>柱描边色</label><input type="color" id="barStrokeColor" value="#ffffff" data-redraw></div>
                </div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="barShowValue" data-redraw>在柱顶显示数值</label>
                    <label>字号：<input type="number" id="barValueFontSize" value="12" min="6" max="24" style="width:60px;" data-redraw></label>
                </div>
                <div class="font-row" style="margin-top:8px;">
                    <span class="font-label">分组顺序</span>
                    <input type="text" id="groupOrder" value=""
                           placeholder="如 B,A,C" style="flex:1;min-width:220px;">
                    <span style="font-size:12px;color:#999;">留空则按出现顺序；未列出的附后</span>
                </div>
            </div>

            <div id="errorBarPanelContainer"></div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出 SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出 PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-axis.js"></script>
    <script src="../COMMON/script/plot-errorbar.js"></script>

    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-title.js"></script>
    <script src="../COMMON/script/plot-legend.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/bar-common.js"></script>
    <script src="../COMMON/script/007.js"></script>
</body>
</html>
