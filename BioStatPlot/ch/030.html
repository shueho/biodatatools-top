<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpSet图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>UpSet图</h2>
            <p>用柱状图与点矩阵展示多集合交集，适合集合数较多时的交集可视化。点击柱状图可查看并复制该区域的元素列表。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：选择集合列</div>
            <div class="param-panel">
                <div class="param-panel-title">分组列</div>
                <div id="setColsBox" class="param-inline" style="gap:10px 24px;">
                    <span style="color:#999;">导入数据后可选择</span>
                </div>
                <div class="info-box" style="margin-top:10px;">
                    每一列代表一个集合，同一列中出现的元素即属于该集合。建议集合数不超过 10。
                </div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与集合颜色</div>
            <div class="param-panel">
                <div class="param-panel-title">分类色板</div>
                <div id="paletteDropdownContainer"></div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                    <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
                </div>
            </div>
            <div id="colorAssignContainer" style="margin-top:14px;"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>

            <div id="upsetTopAxisPanel"></div>

            <div id="upsetSetAxisPanel"></div>

            <div class="param-panel">
                <div class="param-panel-title">UpSet图设置</div>

                <div class="param-subsection">布局</div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label>上/下高度比</label>
                        <input type="number" id="upsetTopHeightRatio" value="0.5" min="0.2" max="0.8" step="0.05" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>柱-矩阵间距(px)</label>
                        <input type="number" id="upsetGapH" value="20" min="0" max="200" step="1" data-redraw>
                    </div>
                </div>

                <div class="param-subsection">交集排序</div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label>排序依据</label>
                        <select id="upsetSortBy" data-redraw>
                            <option value="size" selected>交集大小</option>
                            <option value="degree">涉及集合数</option>
                            <option value="lex">集合组合顺序</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>排序方向</label>
                        <select id="upsetSortDir" data-redraw>
                            <option value="desc" selected>降序</option>
                            <option value="asc">升序</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>最多显示交集数</label>
                        <input type="number" id="upsetMaxItems" value="20" min="1" max="500" step="1" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>最小交集大小</label>
                        <input type="number" id="upsetMinCount" value="1" min="1" step="1" data-redraw>
                    </div>
                </div>

                <div class="param-subsection">集合顺序</div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label>排序方式</label>
                        <select id="upsetSetOrder" data-redraw>
                            <option value="original" selected>原始顺序</option>
                            <option value="sizeDesc">集合大小降序</option>
                            <option value="sizeAsc">集合大小升序</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="param-item" style="grid-column: span 3;" id="upsetSetCustomOrderItem">
                        <label>自定义顺序（逗号或空白分隔）</label>
                        <input type="text" id="upsetSetCustomOrder" placeholder="例如：A, B, C" data-redraw>
                    </div>
                </div>

                <div class="param-subsection">上部分 - 交集柱状图</div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetTopYAxisShow" checked data-redraw>显示Y轴(数值轴)</label>
                    </div>
                    <div class="param-item">
                        <label>Y轴位置</label>
                        <select id="upsetTopYAxisPos" data-redraw>
                            <option value="left" selected>左侧</option>
                            <option value="right">右侧</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>柱宽比例</label>
                        <input type="number" id="upsetBarWidth" value="0.6" min="0.1" max="0.95" step="0.05" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>柱颜色</label>
                        <input type="color" id="upsetBarColor" value="#4e79a7" data-redraw>
                    </div>
                </div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetShowCount" checked data-redraw>显示交集数值</label>
                    </div>
                    <div class="param-item">
                        <label>数值字号</label>
                        <input type="number" id="upsetCountFontSize" value="10" min="6" max="24" step="1" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>数值颜色</label>
                        <input type="color" id="upsetCountColor" value="#333333" data-redraw>
                    </div>
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetCountBold" data-redraw>数值加粗</label>
                        <label class="mini-check"><input type="checkbox" id="upsetCountItalic" data-redraw>数值斜体</label>
                    </div>
                </div>

                <div class="param-subsection">下部分 - 点矩阵</div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label>点大小</label>
                        <input type="number" id="upsetPointSize" value="9" min="2" max="24" step="1" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>连线粗细</label>
                        <input type="number" id="upsetLineWidth" value="1.5" min="0.5" max="6" step="0.5" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>连线颜色</label>
                        <input type="color" id="upsetLineColor" value="#888888" data-redraw>
                    </div>
                </div>

                <div class="param-subsection">下部分 - 集合条形图</div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetShowSetBars" checked data-redraw>显示集合大小条形</label>
                    </div>
                    <div class="param-item">
                        <label>条形宽度比例</label>
                        <input type="number" id="upsetSetBarWidth" value="0.3" min="0.05" max="1" step="0.05" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>条形颜色</label>
                        <select id="upsetSetBarColorMode" data-redraw>
                            <option value="set" selected>跟随集合色</option>
                            <option value="uniform">统一颜色</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>统一颜色</label>
                        <input type="color" id="upsetSetBarColor" value="#999999" data-redraw>
                    </div>
                </div>
                <div class="param-grid cols-4" style="margin-bottom:10px;">
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetShowSetValues" checked data-redraw>显示集合数值</label>
                    </div>
                    <div class="param-item">
                        <label>集合数值字号</label>
                        <input type="number" id="upsetSetValueFontSize" value="10" min="6" max="24" step="1" data-redraw>
                    </div>
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetSetValueBold" data-redraw>数值加粗</label>
                        <label class="mini-check"><input type="checkbox" id="upsetSetValueItalic" data-redraw>数值斜体</label>
                    </div>
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetSetAxisShowX" checked data-redraw title="隐藏集合大小条形时该轴不显示">显示X轴(大小轴)</label>
                    </div>
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetSetAxisShowY" checked data-redraw>显示Y轴(集合名轴)</label>
                    </div>
                </div>

                <div class="param-subsection">轨道</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label class="mini-check"><input type="checkbox" id="upsetShowTrack" checked data-redraw>显示轨道线</label>
                    </div>
                    <div class="param-item">
                        <label>轨道颜色</label>
                        <input type="color" id="upsetTrackColor" value="#e8edf2" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>轨道粗细</label>
                        <input type="number" id="upsetTrackWidth" value="1" min="0.5" max="6" step="0.5" data-redraw>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
    <script src="../COMMON/donate-widget-left.js"></script>

    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/plot-axis.js"></script>
    <script src="../COMMON/script/030.js"></script>
</body>
</html>
