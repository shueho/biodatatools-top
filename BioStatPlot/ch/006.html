<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同心环图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>同心环图</h2>
            <p>每个类别占据一个同心圆环，环的厚度按占比绘制，像年轮一样从内向外层层包裹。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：指定数据列与排序</div>

            <div class="param-panel">
                <div class="param-panel-title">数据列</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>分类列</label>
                        <select id="catColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>数值列</label>
                        <select id="valColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">排序</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>排序依据</label>
                        <select id="sortBy" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>排序方向</label>
                        <select id="sortDir">
                            <option value="desc" selected>从大到小</option>
                            <option value="asc">从小到大</option>

                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>

            <div class="param-panel">
                <div class="param-panel-title">分类色板</div>
                <div id="paletteDropdownContainer"></div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                    <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
                </div>
            </div>

            <div id="colorAssignContainer"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>
            <div id="legendSettingsPanel"></div>

            <div class="param-panel">
                <div class="param-panel-title">标签</div>

                <div class="param-inline">
                    <label>字号
                        <input type="number" id="labelFontSize" value="13" min="6" max="36" data-redraw>
                    </label>
                    <label class="mini-check"><input type="checkbox" id="labelBold" data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="labelItalic" data-redraw>斜</label>
                </div>

                <div class="param-inline">
                    <label>内容
                        <select id="labelContent" data-redraw>
                            <option value="none" selected>不显示</option>
                            <option value="name">类别名</option>
                            <option value="value">原始值</option>
                            <option value="pct">百分比</option>
                            <option value="name_pct">类别名 + 百分比</option>
                        </select>
                    </label>
                    <label>小数位
                        <input type="number" id="labelDecimals" value="1" min="0" max="4" step="1" style="width:70px;" data-redraw>
                    </label>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">同心环设置</div>

                <div class="param-grid cols-4">
                    <div class="param-item"><label>内半径</label>
                        <input type="number" id="innerRadius" value="40" min="0" max="600" step="5" data-redraw></div>
                    <div class="param-item"><label>外半径</label>
                        <input type="number" id="outerRadius" value="280" min="60" max="1000" step="10" data-redraw></div>
                    <div class="param-item"><label>环间隙(px)</label>
                        <input type="number" id="ringGap" value="3" min="0" max="40" step="0.5" data-redraw></div>
                    <div class="param-item"><label>起始角度(°)</label>
                        <input type="number" id="startAngle" value="0" min="-360" max="720" step="5" data-redraw></div>
                    <div class="param-item"><label>终止角度(°)</label>
                        <input type="number" id="endAngle" value="360" min="-360" max="720" step="5" data-redraw></div>
                    <div class="param-item">
                        <label>环顺序</label>
                        <select id="ringOrder" data-redraw>
                            <option value="inner" selected>第一项在最内圈</option>
                            <option value="outer">第一项在最外圈</option>
                        </select>
                    </div>
                </div>

                <div class="param-inline" style="margin-top:10px;">
                    <label><input type="checkbox" id="showRingStroke" checked data-redraw>显示环描边</label>
                    <label>描边色
                        <input type="color" id="ringStrokeColor" value="#ffffff" data-redraw>
                    </label>
                    <label>描边宽度
                        <input type="number" id="ringStrokeWidth" value="1" min="0" max="6" step="0.5" style="width:70px;" data-redraw>
                    </label>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/006.js"></script>
</body>
</html>
