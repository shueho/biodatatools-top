<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平面饼图/环形图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>平面饼图/环形图</h2>
            <p>绘制平面饼图或环形图，设置内半径即可绘制环形图。</p>
        </div>

        <div id="importPanel"></div>

<div class="step-card">
    <div class="step-title">第二步：指定数据列与排序</div>

    <div class="param-panel">
        <div class="param-panel-title">数据列</div>
        <div class="param-grid cols-4">
            <div class="param-item">
                <label>分类列</label>
                <select id="catColSel" disabled><option>— 请先导入数据 —</option></select>
            </div>
            <div class="param-item">
                <label>数值列</label>
                <select id="valColSel" disabled><option>— 请先导入数据 —</option></select>
            </div>
        </div>
    </div>

    <div class="param-panel">
        <div class="param-panel-title">排序</div>
        <div class="param-grid cols-4">
            <div class="param-item">
                <label>排序依据</label>
                <select id="sortBy" disabled><option>— 请先导入数据 —</option></select>
            </div>
            <div class="param-item">
                <label>排序方向</label>
                <select id="sortDir">
                    <option value="desc" selected>从大到小</option>
                    <option value="asc">从小到大</option>
                </select>
            </div>
        </div>
    </div>
</div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>

            <div style="font-size:14px;font-weight:700;color:#1f4068;margin:0 0 4px;">分类色板</div>
            <div id="paletteDropdownContainer"></div>
            <div class="param-inline" style="margin-top:8px;">
                <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
            </div>
            <div id="colorAssignContainer" style="margin-top:16px;"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>
            <div id="legendSettingsPanel"></div>

            <div class="param-panel">
                <div class="param-panel-title">标签</div>

                <div class="param-inline">
                    <label>字号
                        <input type="number" id="labelFontSize" value="16" min="8" max="36" data-redraw>
                    </label>
                    <label class="mini-check"><input type="checkbox" id="labelBold" data-redraw>粗</label>
                    <label class="mini-check"><input type="checkbox" id="labelItalic" data-redraw>斜</label>
                </div>

                <div class="param-inline">
                    <label>分类名位置
                        <select id="namePosition" data-redraw>
                            <option value="none">不显示</option>
                            <option value="inside" selected>圆内</option>
                            <option value="outside">圆外</option>
                        </select>
                    </label>
                </div>

                <div class="param-inline">
                    <label>值标签位置
                        <select id="valuePosition" data-redraw>
                            <option value="none">不显示</option>
                            <option value="inside" selected>圆内</option>
                            <option value="outside">圆外</option>
                        </select>
                    </label>
                    <label>值内容
                        <select id="valueContent" data-redraw>
                            <option value="pct" selected>百分比</option>
                            <option value="value">原始值</option>
                            <option value="pct_value">百分比 + 原始值</option>
                        </select>
                    </label>
                    <label>圆外偏移
                        <input type="number" id="labelOffset" value="20" min="0" max="200" step="5" style="width:70px;" data-redraw>px
                    </label>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">饼图设置</div>

                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>外半径</label>
                        <input type="number" id="outerRadius" value="200" min="40" step="10" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>内半径</label>
                        <input type="number" id="innerRadius" value="0" min="0" step="10" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>扇形方向</label>
                        <select id="pieDirection" data-redraw>
                            <option value="clockwise" selected>顺时针</option>
                            <option value="counterclockwise">逆时针</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>扇区描边</label>
                        <input type="color" id="sliceStroke" value="#ffffff" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>描边宽度</label>
                        <input type="number" id="strokeWidth" value="1.5" min="0" max="6" step="0.5" data-redraw>
                    </div>
                </div>

                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="mergeSmall" data-redraw>合并小扇形</label>
                    <label>阈值
                        <input type="number" id="mergeThreshold" value="3" min="0" max="30" step="0.5" style="width:70px;" data-redraw>%
                    </label>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/001.js"></script>
</body>
</html>
