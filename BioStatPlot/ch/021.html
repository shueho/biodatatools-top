<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带误差棒的散点图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>带误差棒的散点图</h2>
            <p>绘制带有均值点与误差棒的散点图。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：指定数据列与排序</div>

            <div class="param-panel">
                <div class="param-panel-title">数据列</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>分类列（X轴）</label>
                        <select id="xColSel" disabled><option value="">— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>数值列</label>
                        <select id="yColSel" disabled><option value="">— 请先导入数据 —</option></select>
                    </div>
                </div>
                <div style="font-size:12px;color:#999;margin-top:8px;">
                    同一分类下的多个重复行会自动计算均值与误差棒。
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">排序</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>排序依据</label>
                        <select id="sortByMode">
                            <option value="__input__" selected>输入顺序</option>
                            <option value="__alpha__">按分类列</option>
                            <option value="__mean__">按均值</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>排序方向</label>
                        <select id="sortDir">
                            <option value="desc" selected>从大到小</option>
                            <option value="asc">从小到大</option>
                        </select>
                    </div>
                </div>
                <div class="param-inline" style="margin-top:10px;">
                    <label>分类顺序
                        <input type="text" id="catOrder" value="" placeholder="如 B,A,C" style="width:280px;">
                    </label>
                    <span style="font-size:12px;color:#999;">留空按排序依据；未列出的分类附后</span>
                </div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>

            <div class="param-panel">
                <div class="param-panel-title">分类色板</div>
                <div id="paletteDropdownContainer"></div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                    <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
                </div>
            </div>

            <div id="colorAssignContainer"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>
            <div id="legendSettingsPanel"></div>
            <div id="axisPanelContainer"></div>

            <div id="errorBarPanelContainer"></div>

            <div class="param-panel">
                <div class="param-panel-title">散点设置</div>
                <div class="param-grid cols-4">
                    <div class="param-item"><label>点大小</label>
                        <input type="number" id="dotSize" value="8" min="2" max="30" step="0.5" data-redraw>
                    </div>
                    <div class="param-item"><label>点形状</label>
                        <select id="dotShape" data-redraw></select>
                    </div>
                    <div class="param-item"><label>点描边色</label>
                        <select id="dotStrokeMode" data-redraw>
                            <option value="white" selected>白色</option>
                            <option value="same">与点同色</option>
                            <option value="none">无描边</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="param-item" id="dotStrokeColorItem" style="display:none;">
                        <label>自定义描边色</label>
                        <input type="color" id="dotStrokeColor" value="#333333">
                    </div>
                    <div class="param-item"><label>点描边宽度</label>
                        <input type="number" id="dotStrokeWidth" value="1.5" min="0" max="6" step="0.5" data-redraw>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-shapes.js"></script>
    <script src="../COMMON/script/plot-axis.js"></script>
    <script src="../COMMON/script/stat-common.js"></script>
    <script src="../COMMON/script/plot-errorbar.js"></script>
    <script src="../COMMON/script/plot-test.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/bar-common.js"></script>
    <script src="../COMMON/script/021.js"></script>
</body>
</html>
