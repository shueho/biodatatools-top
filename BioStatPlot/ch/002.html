<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夫饼图 - BioDataTools</title>
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/plot-common.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>华夫饼图</h2>
            <p>用形状网格展示各类别占比，支持方形、圆形、菱形等自定义形状。</p>
        </div>

        <div id="importPanel"></div>

        <div class="step-card">
            <div class="step-title">第二步：指定数据列与排序</div>

            <div class="param-panel">
                <div class="param-panel-title">数据列</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>分类列</label>
                        <select id="catColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>数值列</label>
                        <select id="valColSel" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                </div>
            </div>

            <div class="param-panel">
                <div class="param-panel-title">排序</div>
                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>排序依据</label>
                        <select id="sortBy" disabled><option>— 请先导入数据 —</option></select>
                    </div>
                    <div class="param-item">
                        <label>排序方向</label>
                        <select id="sortDir">
                            <option value="desc" selected>从大到小</option>
                            <option value="asc">从小到大</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：选择色板与颜色</div>

            <div class="param-panel">
                <div class="param-panel-title">分类色板</div>
                <div id="paletteDropdownContainer"></div>
                <div class="param-inline" style="margin-top:8px;">
                    <label><input type="checkbox" id="reversePalette">反转色板顺序</label>
                    <label><input type="checkbox" id="cycleColors">色板颜色循环</label>
                </div>
            </div>

            <div id="colorAssignContainer"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第四步：形状设置</div>
            <div id="shapeSelectorContainer"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第五步：设置绘图参数</div>

            <div id="globalSettingsPanel"></div>
            <div id="legendSettingsPanel"></div>

            <div class="param-panel">
                <div class="param-panel-title">华夫饼图设置</div>

                <div class="param-grid cols-4">
                    <div class="param-item">
                        <label>排布方向</label>
                        <select id="waffleDirection" data-redraw>
                            <option value="horizontal" selected>横向</option>
                            <option value="vertical">纵向</option>
                        </select>
                    </div>
                    <div class="param-item">
                        <label>总格子数</label>
                        <input type="number" id="waffleTotal" value="100" min="1" max="10000" step="1" data-redraw>
                    </div>
                    <div class="param-item" id="colsItem">
                        <label>列数</label>
                        <input type="number" id="waffleCols" value="10" min="1" max="200" data-redraw>
                    </div>
                    <div class="param-item hide" id="rowsItem">
                        <label>行数</label>
                        <input type="number" id="waffleRows" value="10" min="1" max="200" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>水平间隙(px)</label>
                        <input type="number" id="waffleGapX" value="2" min="0" max="20" step="0.5" data-redraw>
                    </div>
                    <div class="param-item">
                        <label>垂直间隙(px)</label>
                        <input type="number" id="waffleGapY" value="2" min="0" max="20" step="0.5" data-redraw>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="drawBtn">绘制图表</button>
            </div>
            <div id="msgTip3" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第六步：预览与导出</div>
            <div class="result-toolbar">
                <button class="btn" id="exportSvgBtn" disabled>导出SVG</button>
                <button class="btn" id="exportPngBtn" disabled>导出PNG</button>
                <span class="spacer"></span>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div class="chart-preview" id="chartPreview">
                <div class="placeholder">导入数据并完成设置后，点击“绘制图表”查看结果</div>
            </div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script src="../COMMON/script/plot-bootstrap.js"></script>
    <script src="../COMMON/script/plot-header.js"></script>
    <script src="../COMMON/script/plot-footer.js"></script>
<script src="../COMMON/donate-widget-left.js"></script>

    <script src="../COMMON/script/plot-common.js"></script>
    <script src="../COMMON/script/plot-shapes.js"></script>
    <script src="../COMMON/script/plot-canvas.js"></script>
    <script src="../COMMON/script/plot-i18n.js"></script>
    <script src="../COMMON/script/plot-app.js"></script>
    <script src="../COMMON/script/plot-mini-preview.js"></script>
    <script src="../COMMON/script/002.js"></script>
</body>
</html>
