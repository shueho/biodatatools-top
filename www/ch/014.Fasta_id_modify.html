<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量提取/修改FASTA序列ID - BioDataTools</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../COMMON/global.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>批量提取/修改FASTA序列ID</h2>
            <p>批量提取或修改FASTA序列的ID。</p>
        </div>

        <div class="step-card">
            <div class="step-title">第一步：导入FASTA序列</div>
            <div class="radio-box">
                <label><input type="radio" name="inputMode" value="file" checked onchange="switchInputMode()">上传文件</label>
                <label><input type="radio" name="inputMode" value="text" onchange="switchInputMode()">粘贴文本</label>
            </div>
            <div class="file-input">
                <input type="file" id="fastaFile" accept=".fasta,.fa,.fna,.ffn,.faa,.frn,.txt,.fas">
            </div>
            <div class="text-input">
                <textarea id="fastaText" placeholder="粘贴标准FASTA格式内容" disabled></textarea>
            </div>
            <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px;">
                <button class="btn" id="loadBtn">导入序列</button>
                <button class="btn" id="exampleBtn">加载示例</button>
            </div>
            <div id="msgTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第二步：修改序列ID</div>
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:6px;">
                <span><strong>ID对照表</strong> <span class="tip-text" style="display:inline; margin-left:10px;" id="idCount">0条</span></span>
                <span style="font-size:0.85rem; color:#888;">（导入序列后可以将旧序列名称复制到EXCEL中，修改第二列后重新导入“旧ID\t新ID”制表符分隔的两列表）</span>
            </div>
            <textarea id="idListText" placeholder="导入序列后，此处显示两列对照表（旧ID\t新ID），修改第二列后粘贴回来即可！"></textarea>

            <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px;">
                <button class="btn" id="copyIdBtn">复制表格</button>
                <button class="btn" id="applyBtn" disabled>应用修改</button>
                <button class="btn" id="resetBtn">清空所有</button>
            </div>
            <div id="applyTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">第三步：导出修改后的FASTA</div>
            <div id="resultArea" style="display:none;">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:6px;">
                    <span><strong>新FASTA文件预览</strong></span>
                    <span style="font-size:0.85rem; color:#6c757d;">（完整内容请下载查看）</span>
                </div>
                <textarea id="resultFastaPreview" readonly style="min-height:150px; background:#f0f2f5; color:#1f4068;"></textarea>

                <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px;">
                    <button class="btn" id="downloadBtn">下载FASTA</button>
                    <button class="btn" id="copyResultBtn">复制FASTA</button>
                </div>
                <div id="resultTip" class="tip-text"></div>
            </div>
            <div id="emptyResult" class="empty-tip">应用修改后，结果将在此处显示</div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script>
        window.headerConfig = {};
    </script>
    <script src="../COMMON/utils.js"></script>
    <script src="../COMMON/header.js"></script>
    <script src="../COMMON/footer.js"></script>

    <script>
        (function() {
            'use strict';

            const fastaFile = document.getElementById('fastaFile');
            const fastaText = document.getElementById('fastaText');
            const loadBtn = document.getElementById('loadBtn');
            const exampleBtn = document.getElementById('exampleBtn');
            const msgTip = document.getElementById('msgTip');

            const idListText = document.getElementById('idListText');
            const copyIdBtn = document.getElementById('copyIdBtn');
            const applyBtn = document.getElementById('applyBtn');
            const resetBtn = document.getElementById('resetBtn');
            const applyTip = document.getElementById('applyTip');
            const idCount = document.getElementById('idCount');

            const resultArea = document.getElementById('resultArea');
            const emptyResult = document.getElementById('emptyResult');
            const resultFastaPreview = document.getElementById('resultFastaPreview');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyResultBtn = document.getElementById('copyResultBtn');
            const resultTip = document.getElementById('resultTip');

            let rawSequences = [];
            let newFastaContent = '';
            let isLocked = false;

            function showMsg(el, msg, type) {
                const prefix = type === 'success' ? '✅ ' : (type === 'error' ? '❌ ' : '');
                el.innerHTML = `<span class="${type}">${prefix}${msg}</span>`;
                if (el === msgTip || el === applyTip || el === resultTip) {
                    setTimeout(() => { if (el.innerHTML === `<span class="${type}">${prefix}${msg}</span>`) el.innerHTML = ''; }, 5000);
                }
            }

            function toast(msg) {
                if (window.showToast) window.showToast(msg);
            }

            function parseFasta(text) {
                const lines = text.split(/\r?\n/);
                const seqs = [];
                let name = '', desc = '', seq = '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    if (trimmed.startsWith('>')) {
                        if (name && seq) seqs.push({ id: name, desc: desc, seq: seq });
                        const rest = trimmed.slice(1).trim();
                        const spaceIdx = rest.indexOf(' ');
                        if (spaceIdx > 0) {
                            name = rest.substring(0, spaceIdx);
                            desc = rest.substring(spaceIdx + 1);
                        } else {
                            name = rest;
                            desc = '';
                        }
                        seq = '';
                    } else {
                        seq += trimmed;
                    }
                }
                if (name && seq) seqs.push({ id: name, desc: desc, seq: seq });
                return seqs;
            }

            function extractNewIdFromLine(line) {
                const trimmed = line.trim();
                if (!trimmed) return null;
                const tokens = trimmed.split(/\s+/);
                return tokens[tokens.length - 1];
            }

            function rebuildFasta(newIds) {
                if (rawSequences.length === 0) return null;
                if (newIds.length !== rawSequences.length) {
                    showMsg(applyTip, '新ID数量（' + newIds.length + '）与旧ID数量（' + rawSequences.length + '）不一致', 'error');
                    return null;
                }
                const lines = [];
                for (let i = 0; i < rawSequences.length; i++) {
                    const seq = rawSequences[i];
                    const newId = newIds[i] || seq.id;
                    let header = '>' + newId;
                    if (seq.desc) header += ' ' + seq.desc;
                    lines.push(header);
                    lines.push(seq.seq);
                }
                return lines.join('\n');
            }

            function loadSequences(text) {
                try {
                    const seqs = parseFasta(text);
                    if (seqs.length === 0) {
                        showMsg(msgTip, '未解析到有效序列（请检查FASTA格式）', 'error');
                        return false;
                    }
                    rawSequences = seqs;

                    isLocked = false;
                    idListText.disabled = false;
                    applyBtn.disabled = false;

                    const lines = seqs.map(s => s.id + '\t' + s.id);
                    idListText.value = lines.join('\n');
                    idCount.textContent = seqs.length + '条';

                    resultArea.style.display = 'none';
                    emptyResult.style.display = 'block';
                    newFastaContent = '';
                    applyTip.innerHTML = '';
                    resultTip.innerHTML = '';

                    showMsg(msgTip, '成功加载 ' + seqs.length + ' 条序列', 'success');
                    toast('加载 ' + seqs.length + ' 条序列');
                    return true;
                } catch (e) {
                    showMsg(msgTip, '解析失败：' + e.message, 'error');
                    return false;
                }
            }

            function applyNewIds() {
                if (isLocked) {
                    showMsg(applyTip, '已锁定，如需修改请点击"清空所有"重新导入', 'warn');
                    return;
                }
                const text = idListText.value.trim();
                if (!text) {
                    showMsg(applyTip, '对照表为空，请先导入序列或粘贴新数据', 'error');
                    return;
                }
                const lines = text.split(/\r?\n/).filter(s => s.trim() !== '');
                if (lines.length === 0) {
                    showMsg(applyTip, '未检测到有效数据', 'error');
                    return;
                }

                const newIds = lines.map(line => extractNewIdFromLine(line));
                if (newIds.some(id => id === null)) {
                    showMsg(applyTip, '某行无效，请确保每行至少有一个ID', 'error');
                    return;
                }

                const rebuilt = rebuildFasta(newIds);
                if (rebuilt === null) return;
                newFastaContent = rebuilt;

                isLocked = true;
                idListText.disabled = true;
                applyBtn.disabled = true;
                idCount.textContent = newIds.length + '条';

                resultArea.style.display = 'block';
                emptyResult.style.display = 'none';
                resultFastaPreview.value = newFastaContent;

                showMsg(applyTip, '应用成功！共 ' + rawSequences.length + ' 条序列', 'success');
                toast('新ID已应用');
            }

            function copyIds() {
                const text = idListText.value;
                if (!text) {
                    showMsg(applyTip, '没有可复制的内容', 'error');
                    return;
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => {
                        showMsg(applyTip, '已复制对照表', 'success');
                        toast('已复制');
                    }).catch(() => fallbackCopy(text, applyTip));
                } else {
                    fallbackCopy(text, applyTip);
                }
            }

            function fallbackCopy(text, tipEl) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showMsg(tipEl, '已复制对照表', 'success');
                    toast('已复制');
                } catch (e) {
                    showMsg(tipEl, '复制失败，请手动复制', 'error');
                }
                document.body.removeChild(ta);
            }

function clearMapping() {
    idListText.value = '';
    idCount.textContent = (rawSequences.length ? rawSequences.length + '条' : '0条');
    resultArea.style.display = 'none';
    emptyResult.style.display = 'block';
    newFastaContent = '';
    isLocked = false;
    idListText.disabled = false;
    applyBtn.disabled = false;
    applyTip.innerHTML = '';
    resultTip.innerHTML = '';
    toast('已清空表格');
}

            function resetAll(silent = false) {
                rawSequences = [];
                newFastaContent = '';
                fastaFile.value = '';
                fastaText.value = '';
                idListText.value = '';
                idCount.textContent = '0条';
                resultArea.style.display = 'none';
                emptyResult.style.display = 'block';
                isLocked = false;
                idListText.disabled = false;
                applyBtn.disabled = true;
                msgTip.innerHTML = '';
                applyTip.innerHTML = '';
                resultTip.innerHTML = '';
                const radio = document.querySelector('input[name="inputMode"][value="file"]');
                if (radio) radio.checked = true;
                switchInputMode();
                if (!silent) toast('已清空所有数据');
            }

            function copyResultFasta() {
                if (!newFastaContent) {
                    showMsg(resultTip, '请先应用修改', 'error');
                    return;
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(newFastaContent).then(() => {
                        showMsg(resultTip, '已复制FASTA内容', 'success');
                        toast('已复制');
                    }).catch(() => fallbackCopy(newFastaContent, resultTip));
                } else {
                    fallbackCopy(newFastaContent, resultTip);
                }
            }

            function downloadFasta() {
                if (!newFastaContent) {
                    showMsg(resultTip, '请先应用修改', 'error');
                    return;
                }
                const blob = new Blob([newFastaContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'renamed_sequences.fasta';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMsg(resultTip, '已下载 renamed_sequences.fasta', 'success');
                toast('已下载');
            }

            window.switchInputMode = function() {
                const mode = document.querySelector('input[name="inputMode"]:checked').value;
                if (mode === 'file') {
                    fastaFile.disabled = false;
                    fastaText.disabled = true;
                    fastaText.value = '';
                } else {
                    fastaFile.disabled = true;
                    fastaFile.value = '';
                    fastaText.disabled = false;
                }
            };

            loadBtn.addEventListener('click', function() {
                const mode = document.querySelector('input[name="inputMode"]:checked').value;
                if (mode === 'file') {
                    const file = fastaFile.files[0];
                    if (!file) {
                        showMsg(msgTip, '请选择文件', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        fastaText.value = e.target.result;
                        loadSequences(e.target.result);
                    };
                    reader.readAsText(file);
                } else {
                    const text = fastaText.value.trim();
                    if (!text) {
                        showMsg(msgTip, '请粘贴FASTA内容', 'error');
                        return;
                    }
                    loadSequences(text);
                }
            });

            exampleBtn.addEventListener('click', function() {
                const example = `>gene1_alpha  alpha subunit
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG
>gene2_beta  beta subunit
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG
>gene3_gamma  gamma subunit
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG
>gene4_delta  delta subunit
ATGGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAG`;
                const radio = document.querySelector('input[name="inputMode"][value="text"]');
                if (radio) radio.checked = true;
                switchInputMode();
                fastaText.value = example;
                loadSequences(example);
            });

            copyIdBtn.addEventListener('click', copyIds);
            applyBtn.addEventListener('click', applyNewIds);
            resetBtn.addEventListener('click', clearMapping);
            downloadBtn.addEventListener('click', downloadFasta);
            copyResultBtn.addEventListener('click', copyResultFasta);

            idListText.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    if (!applyBtn.disabled) applyBtn.click();
                }
                if (e.key === 'C' && (e.ctrlKey || e.metaKey) && e.shiftKey) {
                    e.preventDefault();
                    copyIds();
                }
            });

            resetAll(true);
            switchInputMode();
        })();
    </script>
</body>
</html>
