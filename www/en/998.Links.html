<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useful Links - BioDataTools</title>
    <link rel="stylesheet" href="../COMMON/global.css">
    <style>
        .main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 0.7rem 1.2rem;
            border: 2px solid #e8edf2;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            border-color: #1f4068;
        }

        .link-card-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            max-height: 70vh;
            overflow-y: auto;
            padding: 0.8rem 1rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(31, 64, 104, 0.1);
            border: 1px solid #e8edf2;
            scrollbar-width: thin;
        }
        .link-card-list::-webkit-scrollbar {
            width: 6px;
        }
        .link-card-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .link-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #f0f4f8;
            transition: background 0.2s;
            border-radius: 6px;
        }
        .link-row:hover {
            background: #f7f9fc;
        }
        .link-row:last-child {
            border-bottom: none;
        }

        .link-info {
            flex: 1;
            margin-right: 1rem;
            overflow: hidden;
            min-width: 0;
        }
        .link-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1f4068;
            text-decoration: none;
            transition: color 0.2s;
            word-break: break-all;
        }
        .link-title:hover {
            color: #fb7299;
            text-decoration: underline;
        }
        .link-desc {
            color: #888;
            font-size: 0.8rem;
            margin-top: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-open-btn {
            background: #1f4068;
            color: #fff;
            border: none;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .link-open-btn:hover {
            background: #2a5688;
        }

        .no-result {
            text-align: center;
            color: #999;
            padding: 2rem;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .main {
                padding: 0 1rem;
            }
            .link-row {
                flex-wrap: wrap;
                gap: 0.5rem;
                padding: 0.8rem 0.6rem;
            }
            .link-info {
                flex: 1 1 100%;
                margin-right: 0;
            }
            .link-open-btn {
                width: 100%;
                text-align: center;
                padding: 0.4rem;
            }
            .search-box input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="common-header"></div>

    <div class="main">
        <div class="page-intro">
            <h2>Useful Links</h2>
            <p>Curated collection of bioinformatics tools, databases and resources.</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search link title or description..." />
        </div>

        <div id="linkContainer" class="link-card-list">
            <div class="no-result">⏳ Loading...</div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script>
        window.headerConfig = {
            //author: '地上飞猪',
        };
    </script>
    <script src="../COMMON/utils.js"></script>
    <script src="../COMMON/header.js"></script>
    <script src="../COMMON/footer-en.js"></script>

    <script>
        (function() {
            const DATA_URL = '../COMMON/links.json';
            const container = document.getElementById('linkContainer');
            const searchInput = document.getElementById('searchInput');
            let links = [];

            function detectLanguage() {
                const path = window.location.pathname;
                if (path.includes('/ch/')) return 'zh';
                if (path.includes('/en/')) return 'en';
                //return 'en';
            }

            function renderRows(filter = '') {
                const keyword = filter.trim().toLowerCase();
                let filtered = links;
                if (keyword) {
                    filtered = links.filter(item => {
                        const title = (item.title || '').toLowerCase();
                        const desc = (item.desc || '').toLowerCase();
                        return title.includes(keyword) || desc.includes(keyword);
                    });
                }

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="no-result">😕 No matching links found</div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const title = (item.title || 'Unnamed').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const desc = (item.desc || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const url = item.url || '#';
                    html += `
                        <div class="link-row">
                            <div class="link-info">
                                <a href="${url}" target="_blank" rel="noopener noreferrer" class="link-title">${title}</a>
                                <div class="link-desc">${desc}</div>
                            </div>
                            <a href="${url}" target="_blank" rel="noopener noreferrer" class="link-open-btn">🔗 Open</a>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            function loadData() {
                fetch(DATA_URL)
                    .then(res => {
                        if (!res.ok) throw new Error('Network request failed');
                        return res.json();
                    })
                    .then(data => {
                        const lang = detectLanguage();
                        const list = data[lang] || data.en || [];
                        if (!Array.isArray(list) || list.length === 0) {
                            container.innerHTML = '<div class="no-result">No link data available</div>';
                            return;
                        }
                        links = list;
                        renderRows();
                    })
                    .catch(err => {
                        console.error('Failed to load link data:', err);
                        container.innerHTML = `<div class="no-result">❌ Failed to load data. Please check the data file.<br>${err.message}</div>`;
                    });
            }

            searchInput.addEventListener('input', function() {
                renderRows(this.value);
            });

            loadData();
        })();
    </script>
</body>
</html>
