<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenBank Feature Extraction - BioDataTools</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/global.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main" id="app">
        <div class="page-intro">
            <h2>GenBank Feature Extraction</h2>
            <p>Upload GenBank file or paste GenBank text to extract gene, CDS, mRNA, intron and other feature sequences.</p>
        </div>

        <div class="step-card">
            <div class="step-title">Step 1: Import GenBank annotation file</div>
            <div class="radio-box">
                <label><input type="radio" name="inputMode" value="file" checked onchange="switchInput()"> Upload GenBank File</label>
                <label><input type="radio" name="inputMode" value="text" onchange="switchInput()"> Paste GenBank Text</label>
            </div>
            <div class="file-input">
                <input type="file" id="gbFile" accept=".gb,.gbk,.genbank">
            </div>
            <div class="text-input">
                <textarea id="gbText" placeholder="Please paste the full GenBank annotation here..." disabled></textarea>
            </div>
            <div id="msgTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">Step 2: Select and extract features</div>
            <div class="filter-box">
                <label><input type="checkbox" value="gene" checked> gene</label>
                <label><input type="checkbox" value="CDS" checked> CDS</label>
                <label><input type="checkbox" value="rRNA" checked> rRNA</label>
                <label><input type="checkbox" value="tRNA" checked> tRNA</label>
                <label><input type="checkbox" value="intron"> intron</label>
                <label><input type="checkbox" value="exon"> exon</label>
            </div>
            <div class="filter-box" style="margin-top:8px;">
                <label><input type="checkbox" value="D-loop"> D-loop</label>
                <label><input type="checkbox" value="promoter"> promoter</label>
                <label><input type="checkbox" value="terminator"> terminator</label>
                <label><input type="checkbox" value="5'UTR"> 5'UTR</label>
                <label><input type="checkbox" value="3'UTR"> 3'UTR</label>
                <label><input type="checkbox" value="misc_feature"> misc_feature</label>
            </div>
            <div style="margin-top:15px;">
                <button class="btn" onclick="parseGB()">Parse & Extract</button>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">View Extracted Results</div>
            <div class="result-toolbar">
                <button class="btn" id="copyAllBtn" onclick="copyAllFasta()" disabled>Copy All Sequences</button>
                <button class="btn" id="downloadBtn" onclick="downloadFasta()" disabled>Download Fasta</button>
                <span id="toolbarTip" class="tip-text"></span>
            </div>
            <div id="resultBox"></div>
        </div>
    </div>

    <textarea id="tempCopyArea" class="copy-temp"></textarea>

    <div id="common-footer"></div>

    <script>
        window.headerConfig = {
            author: 'Original author: Paul Stothard, University of Alberta, Canada. Modified by Di Shang Fei Zhu.',
        };
    </script>
    <script src="../COMMON/utils.js"></script>
    <script src="../COMMON/header.js"></script>
    <script src="../COMMON/footer-en.js"></script>

    <script>
        let rawGBContent = "";
        let fastaAll = "";
        const msgTip = document.getElementById("msgTip");
        const resultBox = document.getElementById("resultBox");
        const gbFile = document.getElementById("gbFile");
        const gbText = document.getElementById("gbText");
        const copyAllBtn = document.getElementById("copyAllBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const toolbarTip = document.getElementById("toolbarTip");
        const tempCopyArea = document.getElementById("tempCopyArea");

        function switchInput() {
            const mode = document.querySelector('input[name="inputMode"]:checked').value;
            rawGBContent = "";
            fastaAll = "";
            resultBox.innerHTML = "";
            msgTip.innerHTML = "";
            toolbarTip.innerHTML = "";
            copyAllBtn.disabled = true;
            downloadBtn.disabled = true;
            if (mode === "file") {
                gbFile.disabled = false;
                gbText.disabled = true;
                gbText.value = "";
            } else {
                gbFile.disabled = true;
                gbFile.value = "";
                gbText.disabled = false;
            }
        }

        gbFile.addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (ev) {
                rawGBContent = ev.target.result;
                msgTip.innerHTML = `<span class="success">✅ File loaded successfully: ${file.name}</span>`;
                window.showToast(`✅ File ${file.name} loaded successfully`);
                resultBox.innerHTML = "";
                fastaAll = "";
                copyAllBtn.disabled = true;
                downloadBtn.disabled = true;
            };
            reader.readAsText(file);
        });

        function getFeatureName(featureText) {
            const patterns = [
                /\/gene\s*=\s*["']?([^"'\n\r]+)["']?/i,
                /\/product\s*=\s*["']?([^"'\n\r]+)["']?/i,
                /\/locus_tag\s*=\s*["']?([^"'\n\r]+)["']?/i,
                /\/note\s*=\s*["']?([^"'\n\r]+)["']?/i
            ];
            for (let pattern of patterns) {
                const match = featureText.match(pattern);
                if (match && match[1]) {
                    return match[1].trim();
                }
            }
            return "NA";
        }

        function filterFastaTitle(str) {
            if (!str) return "";
            return str.replace(/[\f\n\r\t]+/g, "").trim();
        }

        function removeNonDna(str) {
            if (!str) return "";
            return str.replace(/[^A-Za-z]/g, '').toUpperCase();
        }

        function reverse(str) {
            return str.split("").reverse().join("");
        }

        function complement(str) {
            const map = {
                A:"T",T:"A",C:"G",G:"C",
                R:"Y",Y:"R",M:"K",K:"M",
                S:"S",W:"W",H:"D",D:"H",
                V:"B",B:"V",N:"N"
            };
            let res = "";
            for(let c of str) res += map[c] || c;
            return res;
        }

        function addReturns(str) { return str; }
        function hasAmbiguousBase(seq) {
            return /[RYMKSWHBVDNrymkshbvd]/.test(seq);
        }

        function Feature(strand) {
            this.strand = strand;
            this.fragments = [];
        }
        Feature.prototype.addFragment = function(sequence) {
            this.fragments.push(sequence);
        };
        Feature.prototype.writeFeature = function() {
            let seq = this.fragments.join("");
            if (this.strand === "complement") {
                seq = reverse(complement(seq));
            }
            return seq;
        };

        function printFeature(featurePos, dnaSequence, outputType) {
            featurePos = featurePos.replace(/<|>/g,"");
            if (featurePos.search(/complement/) != -1) {
                var feature = new Feature("complement");
            } else {
                var feature = new Feature("direct");
            }
            var posArray = featurePos.replace(/\)/g,"").split(/\(/);
            var pairArray = posArray[posArray.length-1].split(/\,/);
            for (var j = 0; j < pairArray.length; j++) {
                var range = pairArray[j].split(/\.\./);
                var start = parseInt(range[0])-1;
                var end = parseInt(range[1]);
                feature.addFragment(dnaSequence.substring(start,end));
            }
            return feature.writeFeature();
        }

        function genBankFeatExtract (genBankFile,outputType,targetKeys) {
            let outputHtml = "";
            let fasta = "";
            genBankFile = "_" + genBankFile + "_";
            var recordArray = genBankFile.split(/LOCUS\s\s\s[^\f\n\r]*/m);
            for (var i=1; i < recordArray.length; i++) {
                var mainArray = recordArray[i].split(/DEFINITION|ACCESSION|FEATURES|ORIGIN[^\f\n\r]*/);
                var dnaSequenceArray = mainArray[4].split (/\/{2}/);
                var dnaSequence = removeNonDna(dnaSequenceArray[0]);
                if(!dnaSequence){
                    outputHtml += '<p class="error">❌ No valid nucleic acid sequence detected.</p>';
                    continue;
                }
                var featureArray = mainArray[3].split(/[\f\n\r] {5,12}\b/);
                let featHtml = prepareFeatures(featureArray,dnaSequence,outputType,targetKeys);
                outputHtml += featHtml.html;
                fasta += featHtml.fasta;
            }
            return { html:outputHtml, fasta:fasta };
        }

        function prepareFeatures (arrayOfFeatures,dnaSequence,outputType,targetKeys) {
            let outHtml = "";
            let outFasta = "";
            for (var i=1; i < arrayOfFeatures.length; i++) {
                arrayOfFeatures[i] = arrayOfFeatures[i].replace(/[\[\]\*]/g,"");
                let featureTitle = (arrayOfFeatures[i].match(/[^ \f\n\r\t\v]+ /) || [""])[0].trim();
                if (!targetKeys.includes(featureTitle.toUpperCase())) continue;

                let geneName = getFeatureName(arrayOfFeatures[i]);

                let firstQualifier = "";
                let qMatch = arrayOfFeatures[i].match(/\/[^\f\n\r]+/);
                if (qMatch) firstQualifier = qMatch[0];
                let qualifierName = firstQualifier ? firstQualifier.split('=')[0].replace(/^\//, '') : "";

                let transPos = null;
                const transMatch = null //arrayOfFeatures[i].match(/\/transl_except\s*=\s*\(pos:(\d+),aa:[^)]+\)/i);
                if (transMatch) {
                    transPos = parseInt(transMatch[1], 10);
                }

                let posPart = arrayOfFeatures[i].replace(new RegExp("^\\s*"+featureTitle),"").split(/\//)[0];

                let seq = printFeature(posPart, dnaSequence, outputType);

                if (transPos !== null) {
                    if (posPart.search(/complement/) != -1) {
                        if (seq.length > 0) {
                            seq = seq.substring(0, seq.length - 1);
                        }
                    } else {
                        if (seq.length >= transPos) {
                            seq = seq.substring(0, transPos - 1) + seq.substring(transPos);
                        }
                    }
                }

                let seqLen = seq.length;
                let namePart = (geneName && geneName !== "NA") ? `${geneName} ` : "";
                let qualPart = (qualifierName && qualifierName !== "") ? `${qualifierName} ` : "";
                let cleanName = namePart.trim().replace(/ /g, '_');
                let header = `>${cleanName} ${featureTitle} Lable=${qualPart} Len=${seqLen}`;
                let warn = hasAmbiguousBase(seq) ? ' <span class="warn">⚠️ Contains degenerate bases.</span>' : '';

                outHtml += `<div style="margin:12px 0;">
                    <p><strong>${header}</strong>${warn}</p>
                    <div class="seq-area">${seq}</div>
                </div>`;
                outFasta += header + "\n" + seq + "\n";
            }
            return { html:outHtml, fasta:outFasta };
        }

        function parseGB() {
            resultBox.innerHTML = "";
            msgTip.innerHTML = "";
            toolbarTip.innerHTML = "";
            fastaAll = "";
            copyAllBtn.disabled = true;
            downloadBtn.disabled = true;

            const mode = document.querySelector('input[name="inputMode"]:checked').value;
            if (mode === "text") {
                rawGBContent = gbText.value;
            }
            const content = rawGBContent;
            if (!content.trim()) {
                msgTip.innerHTML = `<span class="error">❌ Please upload a file or paste GenBank text first.</span>`;
                return;
            }
            const checks = document.querySelectorAll('.filter-box input:checked');
            if (checks.length === 0) {
                msgTip.innerHTML = `<span class="error">❌ Please select at least one feature.</span>`;
                return;
            }
            const targetKeys = Array.from(checks).map(cb => cb.value.toUpperCase());
            const res = genBankFeatExtract(content, "separated", targetKeys);
            resultBox.innerHTML = `<div class="result-item">${res.html}</div>`;
            fastaAll = res.fasta;

            if (fastaAll) {
                copyAllBtn.disabled = false;
                downloadBtn.disabled = false;
            }
        }

        function copyAllFasta() {
            if (!fastaAll || fastaAll.trim() === "") {
                window.showToast('❌ No sequences to copy.');
                return;
            }
            copyAllBtn.disabled = true;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fastaAll)
                    .then(() => {
                        window.showToast('✅ All sequences copied successfully!');
                    })
                    .catch(() => {
                        copyByTempArea();
                    })
                    .finally(() => {
                        copyAllBtn.disabled = false;
                    });
            } else {
                copyByTempArea();
                copyAllBtn.disabled = false;
            }
        }

        function copyByTempArea() {
            tempCopyArea.value = fastaAll;
            tempCopyArea.select();
            tempCopyArea.setSelectionRange(0, tempCopyArea.value.length);
            try {
                const success = document.execCommand("copy");
                if (success) {
                    window.showToast('✅ All sequences copied successfully!');
                } else {
                    window.showToast('❌ Copy failed. Please copy manually.');
                }
            } catch (e) {
                window.showToast('❌ Copy error.');
            }
            tempCopyArea.value = "";
        }

        function downloadFasta() {
            if (!fastaAll) return;
            const blob = new Blob([fastaAll], {type:"text/plain"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "features.fasta";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
