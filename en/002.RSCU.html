<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSCU Calculation Tool - BioDataTools</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../COMMON/global.css">
</head>
<body>

    <div id="common-header"></div>

    <div class="main" id="app">
        <div class="page-intro">
            <h2>RSCU Calculation Tool</h2>
            <p>Calculate Relative Synonymous Codon Usage (RSCU).</p>
        </div>

        <div class="step-card">
            <div class="step-title">Step 1: Import FASTA sequences</div>
            <div class="radio-box">
                <label>
                    <input type="radio" name="inputMode" value="file" checked onchange="switchInput()"> Upload FASTA File
                </label>
                <label>
                    <input type="radio" name="inputMode" value="text" onchange="switchInput()"> Paste FASTA Text
                </label>
            </div>
            <div class="file-input">
                <input type="file" id="fastaFile" accept=".fasta,.fa,.fna,.txt">
            </div>
            <div class="text-input">
                <textarea id="fastaText" placeholder="Paste standard FASTA content. Note: The text before the first space in the sequence ID will be used as the gene name. Please rename any duplicates in advance." disabled></textarea>
            </div>
            <div id="msgTip" class="tip-text"></div>
        </div>

        <div class="step-card">
            <div class="step-title">Step 2: Parameter Settings</div>
            <div class="filter-box">
                <label>Genetic Code Table:</label>
                <select id="codonTableSel"></select>

                <label>Calculation Mode: </label>
                <select id="calcMode">
                    <option value="total">Combine All Sequences</option>
                    <option value="allGene">Individual Sequence Calculation</option>
                </select>

                <button class="btn" id="gotoNcbiCodon">View NCBI Codon Table</button>
                <button class="btn" onclick="runAnalysis()">Calculate</button>
            </div>

            <div class="custom-codon-box">
                <button class="btn" style="margin-bottom:8px;" id="toggleCustomBtn">Expand Custom Codon</button>
                <div id="customInner" class="hide">
                    <p>Format: codon amino_acid (use TER for stop codons), one mapping per line.</p>
                    <textarea id="customCodonText" placeholder="e.g., UUU F"></textarea>
                    <div style="margin-top:8px;display:flex;gap:10px;">
                        <button class="btn" id="loadCustomBtn">Load</button>
                        <button class="btn" id="clearCustomBtn">Clear</button>
                    </div>
                    <div id="customTip" class="tip-text"></div>
                </div>
            </div>
            <div id="tableViewTip" class="tip-text"></div>

            <div class="preview-table-wrap">
                <h4>Preview of Current Codon Table</h4>
                <div id="codonPreview"></div>
            </div>
        </div>

        <div class="step-card">
            <div class="step-title">Step 3: View Results</div>
            <div class="result-top">
                <button class="btn" id="copyResultBtn" disabled>Copy Results</button>
                <button class="btn" id="exportCsvBtn" disabled>Export RSCU Results (CSV)</button>
            </div>
            <div id="resultBox"></div>
        </div>
    </div>

    <div id="common-footer"></div>

    <script>
        window.headerConfig = {
            //author: '作者：地上飞猪',
        };
    </script>

    <script src="../COMMON/utils.js"></script>
    <script src="../COMMON/header.js"></script>
    <script src="../COMMON/footer-en.js"></script>

    <script src="../COMMON/sms_genetic_codes.js"></script>
    <script src="../COMMON/codon_config-en.js"></script>

    <script>
        function renderCodonPreview(codonMap){
            const previewBox = document.getElementById("codonPreview");
            const codonList = Object.entries(codonMap);
            if(codonList.length === 0){
                previewBox.innerHTML = '<span class="error">No codon data available.</span>';
                return;
            }

            const groupU = [], groupC = [], groupA = [], groupG = [];
            codonList.forEach(([codon, aa]) => {
                const first = codon[0];
                const item = {codon, aa};
                switch(first){
                    case "U": groupU.push(item); break;
                    case "C": groupC.push(item); break;
                    case "A": groupA.push(item); break;
                    case "G": groupG.push(item); break;
                }
            });

            function buildColHtml(list, title){
                let html = `<div class="codon-col"><table class="preview-table">
                    <tr><th colspan="2">${title}</th></tr>
                    <tr><th>Codon</th><th>Amino Acid</th></tr>`;
                list.forEach(item => {
                    html += `<tr><td>${item.codon}</td><td>${item.aa}</td></tr>`;
                });
                html += `</table></div>`;
                return html;
            }

            let totalHtml = `<div class="codon-preview-row">`;
            totalHtml += buildColHtml(groupU, "First position: U");
            totalHtml += buildColHtml(groupC, "First position: C");
            totalHtml += buildColHtml(groupA, "First position: A");
            totalHtml += buildColHtml(groupG, "First position: G");
            totalHtml += `</div>`;

            previewBox.innerHTML = totalHtml;
        }

        let rawFasta = "";
        let geneList = [];
        let geneSeqMap = new Map();
        let currentCodonTable = {};
        let exportData = [];

        const codonTableSel = document.getElementById("codonTableSel");
        const gotoNcbiCodon = document.getElementById("gotoNcbiCodon");
        const toggleCustomBtn = document.getElementById("toggleCustomBtn");
        const customInner = document.getElementById("customInner");
        const customCodonText = document.getElementById("customCodonText");
        const loadCustomBtn = document.getElementById("loadCustomBtn");
        const clearCustomBtn = document.getElementById("clearCustomBtn");
        const customTip = document.getElementById("customTip");
        const tableViewTip = document.getElementById("tableViewTip");

        const fastaFile = document.getElementById("fastaFile");
        const fastaText = document.getElementById("fastaText");
        const msgTip = document.getElementById("msgTip");

        const calcMode = document.getElementById("calcMode");
        const resultBox = document.getElementById("resultBox");
        const exportCsvBtn = document.getElementById("exportCsvBtn");

        gotoNcbiCodon.onclick = function(){
            window.open("https://www.ncbi.nlm.nih.gov/Taxonomy/Utils/wprintgc.cgi", "_blank");
        };

        function switchInput(){
            const mode = document.querySelector('input[name="inputMode"]:checked').value;
            resetAll();
            if(mode === "file"){
                fastaFile.disabled = false;
                fastaText.disabled = true;
            }else{
                fastaFile.disabled = true;
                fastaText.disabled = false;
            }
        }

        function initCodonSelect(){
            codonTableSel.innerHTML = "";
            for(const id in TABLE_ID_NAME_MAP){
                const opt = document.createElement("option");
                opt.value = id;
                opt.textContent = TABLE_ID_NAME_MAP[id];
                codonTableSel.appendChild(opt);
            }
            const initId = Number(codonTableSel.value);
            currentCodonTable = getCodonTable(initId);
            renderCodonPreview(currentCodonTable);
        }

        codonTableSel.addEventListener("change",function(){
            const id = Number(this.value);
            currentCodonTable = getCodonTable(id);
            tableViewTip.innerHTML = `<span class="success">Switched to: ${getTableName(id)}</span>`;
            renderCodonPreview(currentCodonTable);
        });

        toggleCustomBtn.onclick = function(){
            customInner.classList.toggle("hide");
        };

        loadCustomBtn.onclick = function(){
            const txt = customCodonText.value.trim();
            if(!txt){
                customTip.innerHTML = '<span class="error">Please enter something.</span>';
                return;
            }
            const lines = txt.split(/\r?\n/).filter(line => line.trim());
            const temp = {};
            let ok = true;
            for(const line of lines){
                const p = line.trim().split(/\s+/);
                if(p.length < 2){ ok=false; break; }
                temp[p[0].toUpperCase()] = p[1];
            }
            if(!ok){
                customTip.innerHTML = '<span class="error">Format error.</span>';
                return;
            }
            currentCodonTable = temp;
            customTip.innerHTML = '<span class="success">Loaded successfully</span>';
            tableViewTip.innerHTML = '<span class="success">Current: Custom Codon Table</span>';
            renderCodonPreview(currentCodonTable);
        };

        clearCustomBtn.onclick = function(){
            customCodonText.value = "";
            customTip.innerHTML = "";
        };

        fastaFile.addEventListener("change",function(e){
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev){
                rawFasta = ev.target.result;
                msgTip.innerHTML = `<span class="success">Loaded: ${file.name}</span>`;
                window.showToast(`✅ File ${file.name} loaded successfully`);
                parseFasta(rawFasta);
            };
            reader.readAsText(file);
        });

        function parseFasta(str){
            geneList = [];
            geneSeqMap.clear();
            const lines = str.split(/\r?\n/).filter(line=>line.trim());
            let name = "", seq = "";
            for(const line of lines){
                if(line.startsWith(">")){
                    if(name && seq){
                        const rna = seq.toUpperCase().replace(/[^ATGC]/g,"").replace(/T/g,"U");
                        geneList.push(name);
                        geneSeqMap.set(name, rna);
                    }
                    name = line.replace(/^>\s*/,"").trim().split(/\s+/)[0];
                    seq = "";
                }else{
                    seq += line;
                }
            }
            if(name && seq){
                const rna = seq.toUpperCase().replace(/[^ATGC]/g,"").replace(/T/g,"U");
                geneList.push(name);
                geneSeqMap.set(name, rna);
            }
            resetResult();
        }

        function getCodonCount(rnaSeq){
            const count = {};
            const allCodonList = Object.keys(currentCodonTable);
            allCodonList.forEach(c => count[c] = 0);

            const fullLen = Math.floor(rnaSeq.length / 3) * 3;
            for(let i=0; i<fullLen; i+=3){
                const codon = rnaSeq.substr(i,3);
                if(count.hasOwnProperty(codon)){
                    count[codon]++;
                }
            }
            return count;
        }

        function calcRSCU(targetGene){
            let totalCount = {};
            const allCodon = Object.keys(currentCodonTable);
            allCodon.forEach(c=>totalCount[c] = 0);

            if(targetGene === "Total"){
                for(const g of geneList){
                    const cnt = getCodonCount(geneSeqMap.get(g));
                    allCodon.forEach(c=> totalCount[c] += cnt[c]||0);
                }
            }else{
                const cnt = getCodonCount(geneSeqMap.get(targetGene));
                allCodon.forEach(c=> totalCount[c] = cnt[c]||0);
            }

            const aaGroup = {};
            for(const c of allCodon){
                const aa = currentCodonTable[c];
                if(!aaGroup[aa]) aaGroup[aa] = [];
                aaGroup[aa].push(c);
            }

            let html = `<div class="result-item">`;
            html += `<div class="gene-title">${targetGene === "Total" ? "Merge All Genes" : "Gene:" + targetGene}</div>`;
            html += `<table>
                <tr>
                    <th>Codon</th>
                    <th>Amino Acid (1‑letter)</th>
                    <th>Amino Acid (3‑letter)</th>
                    <th>Count</th>
                    <th>RSCU</th>
                </tr>`;

            const data = [];
            for(const c of allCodon){
                const aaOne = currentCodonTable[c];
                const aaThree = AA_ONE_TO_THREE[aaOne] || "";
                const group = aaGroup[aaOne] || [];
                const sum = group.reduce((s,item)=> s + (totalCount[item]||0), 0);
                const num = group.length;
                let rscu = 0;
                if(sum > 0 && num > 0){
                    rscu = totalCount[c] / (sum / num);
                }
                const freq = totalCount[c] || 0;

                html += `<tr>
                    <td>${c}</td>
                    <td>${aaOne}</td>
                    <td>${aaThree}</td>
                    <td>${freq}</td>
                    <td>${rscu.toFixed(4)}</td>
                </tr>`;

                data.push({
                    gene: targetGene === "Total" ? "Total" : targetGene,
                    codon: c,
                    aaOne: aaOne,
                    aaThree: aaThree,
                    frequency: freq,
                    rscu: rscu.toFixed(4)
                });
            }
            html += `</table></div>`;
            return {html, data};
        }

        function resetResult(){
            resultBox.innerHTML = "";
            exportData = [];
            exportCsvBtn.disabled = true;
            copyResultBtn.disabled = true;
        }

        function resetAll(){
            rawFasta = "";
            fastaFile.value = "";
            fastaText.value = "";
            msgTip.innerHTML = "";
            tableViewTip.innerHTML = "";
            customTip.innerHTML = "";
            resetResult();
        }

        function runAnalysis(){
            if(document.querySelector('input[name="inputMode"][value="text"]:checked')){
                rawFasta = fastaText.value;
            }
            if(!rawFasta){
                resultBox.innerHTML = '<span class="error">❌ No valid sequence found.</span>';
                return;
            }
            parseFasta(rawFasta);
            if(geneList.length === 0){
                resultBox.innerHTML = '<span class="error">❌ No valid genes parsed.</span>';
                return;
            }

            const mode = calcMode.value;
            let outHtml = "";
            exportData = [];

            if(mode === "total"){
                const res = calcRSCU("Total");
                outHtml = res.html;
                exportData = exportData.concat(res.data);
            }else{
                for(const g of geneList){
                    const res = calcRSCU(g);
                    outHtml += res.html;
                    exportData = exportData.concat(res.data);
                }
            }

            resultBox.innerHTML = outHtml;
            exportCsvBtn.disabled = false;
            copyResultBtn.disabled = false; 
            window.showToast('✅ Calculation complete.');
        }

        function exportToCSV(){
            if(exportData.length === 0) return;
            let csv = "\ufeffGene Name,Codon,Amino Acid (1-letter),Amino Acid (3-letter),Count,RSCU\n";
            exportData.forEach(item=>{
                csv += `${item.gene},${item.codon},${item.aaOne},${item.aaThree},${item.frequency},${item.rscu}\n`;
            });
            const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "RSCU_results.csv";
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            window.showToast('✅ Export successful.');
        }
function copyResultToClipboard() {
    if (exportData.length === 0) {
        window.showToast('❌ No results to copy.');
        return;
    }
    let csv = "\ufeffGene Name,Codon,Amino Acid (1-letter),Amino Acid (3-letter),Count,RSCU\n";
    exportData.forEach(item => {
        csv += `${item.gene},${item.codon},${item.aaOne},${item.aaThree},${item.frequency},${item.rscu}\n`;
    });
    navigator.clipboard.writeText(csv).then(() => {
        window.showToast('✅ Results copied to clipboard.');
    }).catch(() => {
        window.showToast('❌ Copy failed. Please copy manually.');
    });
}
document.getElementById('copyResultBtn').addEventListener('click', copyResultToClipboard);


        exportCsvBtn.addEventListener("click", exportToCSV);
        window.onload = initCodonSelect;
    </script>
</body>
</html>
